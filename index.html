/* ===================== 生成 ===================== */
async function post(url, body){
  try {
    const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    return { ok:false, error:'无法连接后端服务：' + e.message };
  }
}
function pollTask(id){
  return new Promise((resolve, reject) => {
    const tick = async () => {
      try {
        const r = await (await fetch('/api/task/' + id)).json();
        if (!r.ok) return reject(new Error(r.error));
        if (r.status === 'SUCCEEDED') return resolve(r);
        if (r.status === 'FAILED' || r.status === 'CANCELED') return reject(new Error(r.message || r.status));
        setTimeout(tick, POLL_MS);
      } catch (err){ reject(err); }
    };
    tick();
  });
}

async function runNode(id){
  const n = nodeById(id);
  if (!n) return;
  if (S.running){ toast('已有任务在跑，请等它结束（同一时刻只跑一个，避免超额计费）', 'err'); return; }
  if (S.backend === false){ toast('后端没连上。请先在项目目录运行 python backend.py，再刷新页面', 'err'); return; }
  if (!S.hasKey){ toast('未配置 DASHSCOPE_API_KEY，请在 .env 写入后重启服务', 'err'); return; }
  if (!canGenerate(n)){ toast('提示词或必填素材缺失，无法生成', 'err'); return; }

  S.running = true;
  n.gen.status = 'run'; n.gen.error = ''; n.gen.effective = '';
  render();

  try {
    if (role(n) === 'imageGen') await runImage(n);
    else await runVideo(n);
  } catch (e){
    n.gen.status = 'err';
    n.gen.error = e.message || String(e);
    toast('「' + nodeName(n) + '」失败：' + n.gen.error, 'err');
  } finally {
    S.running = false;
    render();
  }
}

async function runVideo(n){
  const mt = mirrorText(n);
  const prompt = mt.on ? mt.text : n.prompt;
  const rm = resolveVideo(n);
  const p = n.params;

  if (rm.note) L('「' + nodeName(n) + '」' + rm.note, 'dim');

  // 帧位已连线但源图片块还没出图 —— 这里才拦，拦在提交前，不产生任何费用
  const fe = edgeOf(n.id, 'first'), le = edgeOf(n.id, 'last');
  const frameOf = e => e ? nodeById(e.from) : null;
  for (const [port, e] of [['首帧', fe], ['尾帧', le]]){
    const src = frameOf(e);
    if (e && (!src || !src.img)) throw new Error(PORT_LABEL[port] + '连的是「' + (src ? nodeName(src) : '?') + '」，但它还没有图。先运行它生成图片，或上传一张。');
  }

  const body = {
    prompt, mode:p.mode, duration:p.duration, resolution:p.resolution,
    ratio:p.ratio, audio:p.audio, model:p.model,
  };
  if (rm.mode === 'i2v' || rm.mode === 'fl'){
    body.firstFrame = fe ? nodeById(fe.from).img.url : null;
    if (rm.mode === 'fl' && le) body.lastFrame = nodeById(le.from).img.url;
  } else if (rm.mode === 'omni'){
    const refs = upstreamMedia(n);
    const pending = upsOf(n.id, 'in').filter(u => (u.type === 'image' && !u.img) || (u.type === 'video' && !u.vid && !u.aud));
    if (pending.length) throw new Error('上游「' + pending.map(nodeName).join('、') + '」还没有素材。先运行它们，或上传素材。');
    body.refs = refs.map(m => ({ local:m.local, kind:m.kind }));
  }

  L('▶ ' + nodeName(n) + ' 提交视频：' + rm.mode + ' · ' + p.duration + 's / ' + p.resolution +
    ' / ' + (rm.mode === 'omni' ? body.refs.length : (rm.mode === 't2v' ? 0 : 1)) + ' 素材 / 提示词 ' + prompt.length + ' 字', 'run');
  const g = await post('/api/generate', body);
  if (!g.ok) throw new Error(g.error);
  if (g.effective_mode && g.effective_mode !== rm.mode)
    L('  后端实际模式 ' + g.effective_mode + '（' + (g.note || '已自动调整') + '）', 'dim');
  n.gen.effective = g.effective_mode;
  n.gen.taskId = g.task_id;
  L('  任务已受理 ' + g.task_id + '，预计 ¥' + g.estimated_cost, 'dim');
  render();

  const fin = await pollTask(g.task_id);
  n.gen.status = 'done';
  n.gen.resultUrl = fin.video_url;
  S.history.push({ kind:'video', id:n.id, name:nodeName(n), url:fin.video_url, ts:new Date().toLocaleTimeString('zh-CN',{hour12:false}), usage:fin.usage });
  L('✔ ' + nodeName(n) + ' 完成，已缓存到本地 cache/', 'ok');
}

async function runImage(n){
  const tx = imgTexts(n);
  let prompt = tx.prompt;
  const neg = tx.neg;
  const refs = upstreamImages(n);
  const p = n.imgParams;
  const stylize = p.way === 'stylize';
  if (stylize) prompt = prompt + STYLE_SUFFIX;

  if (!refs.length && !prompt.trim()) throw new Error('提示词为空');

  const body = {
    prompt, model:p.model, size:imgSizeOf(p), n:p.n,
    negativePrompt:neg || undefined, seed:p.seed || undefined,
    promptExtend:p.promptExtend, watermark:p.watermark,
    promptExtendMode: refs.length ? 'direct' : 'agent',
    refs: refs.length > 10 ? [] : refs.map(r => r.img.url),
  };
  if (refs.length > 10){
    const maxRefs = (S.cfg.imageModels.find(m => m.id === p.model) || {}).maxRefs || 3;
    throw new Error(p.model + ' 最多 ' + maxRefs + ' 张参考图，当前 ' + refs.length + ' 张，请断开多余连线');
  }

  L('▶ ' + nodeName(n) + ' 提交生图：' + p.model + ' · ' + (p.ratio === 'auto' ? '自动尺寸' : p.ratio + ' / ' + p.res) + ' ×' + p.n +
    ' · ' + (refs.length ? refs.length + ' 张参考图' : '文生图') +
    (neg.trim() ? ' · 负向 ' + neg.length + ' 字' : ''), 'run');
  const g = await post('/api/genimg', body);
  if (!g.ok) throw new Error(g.error);
  if (g.note) L('  ' + g.note, 'dim');
  n.gen.images = g.images;
  n.gen.status = 'done';
  // 结果落 media/，图片块随即变成参考图源，可继续连给下游
  n.img = { name:'生成图-' + Date.now(), url:g.images[0], box:g.images[0] };
  S.history.push({ kind:'image', id:n.id, name:nodeName(n), url:g.images[0], ts:new Date().toLocaleTimeString('zh-CN',{hour12:false}) });
  L('✔ ' + nodeName(n) + ' 生成 ' + g.count + ' 张，已存 media/，该块现在可作为参考图供下游使用', 'ok');
}

async function runAll(){
  if (S.running){ toast('已有任务在跑', 'err'); return; }
  const gens = topo().filter(isGen);
  if (!gens.length){ toast('画布上还没有生成块', 'err'); return; }
  for (const n of gens){
    if (!canGenerate(n)){
      n.gen.status = 'err';
      n.gen.error = '提示词或必填素材缺失，已跳过';
      continue;
    }
    await runNode(n.id);
  }
  L('全部生成块处理完毕', 'dim');
  render();
}
function topo(){
  const order = [], seen = new Set(), stack = new Set();
  const visit = id => {
    if (seen.has(id) || stack.has(id)) return;
    stack.add(id);
    upsOf(id).forEach(u => visit(u.id));
    stack.delete(id); seen.add(id); order.push(id);
  };
  S.nodes.forEach(n => visit(n.id));
  return order.map(nodeById).filter(Boolean);
}

/* ===================== 导入导出保存 ===================== */
/**
 * 「保存并覆盖当前 json」能实现，靠的是 File System Access API。
 * 浏览器出于安全**永远不会**告诉你用户选的文件在磁盘上的真实路径——
 * 连 <input type=file> 拿到的 File 对象也没有路径。
 * 所以导入时必须用 showOpenFilePicker() 换回一个 FileSystemFileHandle，
 * 保存时再用这个句柄 createWritable() 原地覆写，才是真的覆盖，不是「再下载一份」。
 * 句柄可以结构化克隆后存进 IndexedDB，刷新页面后仍能覆盖同一个文件。
 */
const FSA_OK = typeof window.showSaveFilePicker === 'function';

const FH = {
  _db: null,
  open(){
    if (this._db) return Promise.resolve(this._db);
    if (!window.indexedDB) return Promise.resolve(null);
    return new Promise(res => {
      let rq;
      try { rq = indexedDB.open('wan3wf', 1); } catch(e){ return res(null); }
      rq.onupgradeneeded = () => { try { rq.result.createObjectStore('kv'); } catch(e){} };
      rq.onsuccess = () => { this._db = rq.result; res(rq.result); };
      rq.onerror = () => res(null);
    });
  },
  async get(k){
    const db = await this.open();
    if (!db) return null;
    return new Promise(res => {
      try {
        const rq = db.transaction('kv').objectStore('kv').get(k);
        rq.onsuccess = () => res(rq.result == null ? null : rq.result);
        rq.onerror = () => res(null);
      } catch(e){ res(null); }
    });
  },
  async set(k, v){
    const db = await this.open();
    if (!db) return false;
    return new Promise(res => {
      try {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => res(true);
        tx.onerror = () => res(false);
      } catch(e){ res(false); }
    });
  },
  async clear(){
    const db = await this.open();
    if (!db) return;
    try { db.transaction('kv', 'readwrite').objectStore('kv').clear(); } catch(e){}
  },
};

const JSON_TYPE = [{ description:'工作流 JSON', accept:{ 'application/json':['.json'] } }];

function wfText(){
  return JSON.stringify({ version:2, name:S.proj, nodes:S.nodes, edges:S.edges }, null, 2);
}
function downloadJson(text, name){
  const blob = new Blob([text], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/** 导出 = 永远另存一份下载，不碰句柄 */
function exportWf(){
  downloadJson(wfText(), (S.fileName || (S.proj || 'workflow') + '.json'));
  L('已导出工作流 JSON' + (S.fileName ? '（' + S.fileName + '）' : ''), 'dim');
}

async function setCurrentFile(handle, name){
  S.fileHandle = handle;
  S.fileName = name;
  S.fileNodeCount = S.nodes.length;
  renderTop();                       // 先点亮按钮，别让界面等 IndexedDB
  await FH.set('handle', handle);
  await FH.set('name', name);
  await FH.set('count', S.fileNodeCount);
}
async function ensureWritable(h){
  const opt = { mode:'readwrite' };
  try {
    if ((await h.queryPermission(opt)) === 'granted') return true;
    return (await h.requestPermission(opt)) === 'granted';
  } catch(e){ return false; }
}
async function writeHandle(h, text){
  const w = await h.createWritable();
  await w.write(new Blob([text], { type:'application/json' }));
  await w.close();
}

/**
 * 保存。优先原地覆盖 S.fileHandle；
 * 没有句柄就弹「另存为」；浏览器不支持 File System Access API 就退回下载。
 */
async function saveWf(){
  const text = wfText();
  // 空画布 + 文件里本来有东西 —— 盖上去等于把用户的工作流删了，必须拦一下
  if (!S.nodes.length && S.fileNodeCount > 0){
    if (!confirm('当前画布是空的，保存会清空「' + S.fileName + '」里的 ' + S.fileNodeCount +
                 ' 个块。\n确定要继续吗？')) return;
  }
  if (S.fileHandle){
    try {
      if (await ensureWritable(S.fileHandle)){
        await writeHandle(S.fileHandle, text);
        S.fileNodeCount = S.nodes.length;
        await FH.set('count', S.fileNodeCount);
        L('已保存并覆盖 ' + S.fileName, 'ok');
        flashSave();
        return;
      }
    } catch(e){
      toast('写入失败（' + (e.message || e) + '），改为另存为', 'err');
    }
  }
  saveAs(text);
}
function saveAs(text){
  const name = S.fileName || ((S.proj || 'workflow') + '.json');
  if (FSA_OK){
    window.showSaveFilePicker({ suggestedName:name, types:JSON_TYPE })
      .then(async h => {
        await writeHandle(h, text);
        await setCurrentFile(h, h.name);
        L('已保存到 ' + h.name, 'ok');
        flashSave();
      })
      .catch(e => {
        if (e && e.name === 'AbortError') return;       // 用户自己取消，不算错误
        toast('保存失败：' + (e.message || e), 'err');
      });
  } else {
    downloadJson(text, name);
    L('已下载 ' + name + '（当前浏览器不支持原地覆盖，导入请用左栏 ↥）', 'dim');
  }
}
function flashSave(){
  const b = $('#saveBtn');
  if (!b) return;
  b.classList.add('flash');
  setTimeout(() => b.classList.remove('flash'), 600);
}

function importWf(file, handle){
  const r = new FileReader();
  r.onload = () => loadWfText(String(r.result), handle, file && file.name);
  r.readAsText(file);
}
/** 左栏 ↥ —— 优先走 showOpenFilePicker 才能拿到句柄，保存时才能真的覆盖 */
async function importWfPicker(){
  if (typeof window.showOpenFilePicker !== 'function'){
    const i = document.createElement('input');
    i.type = 'file'; i.accept = '.json';
    i.onchange = () => { if (i.files[0]) importWf(i.files[0], null); };
    i.click();
    return;
  }
  try {
    const hs = await window.showOpenFilePicker({ types:JSON_TYPE, multiple:false });
    const h = hs[0];
    if (!h) return;
    const f = await h.getFile();
    loadWfText(await f.text(), h, f.name);
  } catch(e){
    if (e && e.name === 'AbortError') return;         // 取消是正常操作
    toast('打开失败：' + (e.message || e), 'err');
  }
}
/* 老工作流的 imgParams.size（像素串或 auto）换算成新的 ratio+res。
   必须在 loadWfText 补默认值之前调用——顺序反了，ratio/res 先被填成 auto/1K，
   用户旧的尺寸选择就丢了。档位沿用 sizeClass 的既有契约（含 1536/2048 算 2K），
   换算后实际提交值会跳到预设表里的近似尺寸（如 1024x1536 → 2:3/2K → 1360x2048）。 */
function legacyImgSpec(size){
  const m = /(\d+)\s*[xX*]\s*(\d+)/.exec(String(size || ''));
  if (!m) return null;
  const w = Number(m[1]), h = Number(m[2]);
  if (!(w > 0 && h > 0)) return null;
  const r = w / h;
  let best = '1:1', bd = Infinity;
  [['16:9',16/9],['3:2',3/2],['4:3',4/3],['1:1',1],['3:4',3/4],['2:3',2/3],['9:16',9/16]]
    .forEach(x => { const d = Math.abs(r - x[1]); if (d < bd){ bd = d; best = x[0]; } });
  return { ratio: best, res: sizeClass(size) };
}
function loadWfText(text, handle, name){
  try {
    const j = JSON.parse(text);
    if (!Array.isArray(j.nodes)) throw new Error('缺少 nodes');
    S.nodes = j.nodes; S.edges = j.edges || [];
    // 补齐新版本字段，老工作流也能载入。
    // 坑：不能直接拿 newNode() 当模板——它会把模板块本身 push 进 S.nodes，
    // 而 forEach 只遍历原始长度，于是多出来的垃圾块留在数组里，导入一次块数就翻倍。
    const base = newNode('text', 0, 0);
    S.nodes.pop();
    S.nodes.forEach(n => {
      if (n.imgParams && n.imgParams.ratio === undefined){
        const lg = legacyImgSpec(n.imgParams.size);
        if (lg){ n.imgParams.ratio = lg.ratio; n.imgParams.res = lg.res; }
        delete n.imgParams.size;
      }
      Object.keys(base).forEach(k => {
        if (n[k] === undefined) n[k] = clone(base[k]);   // clone：否则多个块共用同一个参数对象
      });
      // imgParams 是嵌套对象，上面那层补不到，得单独再补一次（老工作流的
      // imgParams 里没有 negativePrompt 这个键）。只补 undefined：
      // 用户自己清空成 '' 的尊重原样，不会被默认值塞回去一段没写过的英文。
      if (n.imgParams){
        Object.keys(base.imgParams).forEach(k => {
          if (n.imgParams[k] === undefined) n.imgParams[k] = clone(base.imgParams[k]);
        });
      }
      n.gen = Object.assign({ status:null, taskId:null, resultUrl:null, error:'', images:[], effective:'' }, n.gen || {});
      n.barOff = n.barOff || { dx:0, dy:0 };
      n.id = n.id || nid();
    });
    // 叠放次序统一重排（老 JSON 没有 z），顺便把 S.zTop 顶到最高
    S.nodes.forEach((n, i) => { n.z = i + 1; });
    S.zTop = S.nodes.length;
    let mx = uid;
    S.nodes.forEach(n => { const m = /^n(\d+)$/.exec(n.id); if (m) mx = Math.max(mx, Number(m[1])); });
    uid = mx + 1;
    S.sel = null; S.selEdge = null;
    if (j.name) S.proj = j.name;
    $('#proj').value = S.proj;
    L('已载入工作流（' + S.nodes.length + ' 个块）', 'ok');
    render();
    if (handle) setCurrentFile(handle, name || (handle.name || 'workflow.json'));
    else { S.fileHandle = null; S.fileName = name || ''; S.fileNodeCount = S.nodes.length; renderTop(); }
  } catch (e){ toast('工作流文件解析失败：' + e.message, 'err'); }
}
/** 刷新后恢复「上次保存到哪个文件」，这样保存仍然覆盖同一个文件 */
async function restoreFileHandle(){
  const h = await FH.get('handle');
  if (!h) return;
  S.fileHandle = h;
  S.fileName = (await FH.get('name')) || h.name || '';
  S.fileNodeCount = (await FH.get('count')) || 0;
  renderTop();
}

/* ===================== 顶栏 / 历史 / 日志 ===================== */
function renderTop(){
  const t = $('#keytag');
  // 三种状态要分清楚：后端没连上 ≠ 没填 Key。之前混成一句「未配置 API Key」，
  // 会让人以为 Key 没保存，实际是服务根本没启动。
  let cls = '', text;
  if (S.backend === false){ cls = 'err'; text = '后端未连接'; }
  else if (S.backend === null){ text = '检测中…'; }
  else if (!S.hasKey){ cls = 'err'; text = '未配置 API Key'; }
  else { cls = 'ok'; text = 'API Key 已配置'; }
  t.className = 'tag ' + cls;
  t.textContent = text;
  t.title = S.backend === false ? '请用 python backend.py 启动服务，再刷新页面' : '';
  const b = $('#runbtn');
  b.disabled = S.running || S.backend === false || S.hasKey === false;
  b.textContent = S.running ? '生成中…' : '▶ 运行工作流';
  $('#addBtn').classList.toggle('on', $('#addPanel').classList.contains('show'));
  // 保存按钮要让人一眼看出「会覆盖哪个文件」
  const sv = $('#saveBtn');
  if (sv){
    if (S.fileName){
      sv.title = '保存并覆盖 ' + S.fileName;
      sv.textContent = '保存';
      sv.classList.add('on');
    } else {
      sv.title = FSA_OK ? '保存到本地 JSON 文件（首次会弹出另存为）'
                        : '当前浏览器不支持原地覆盖，保存会退回下载';
      sv.textContent = '保存';
      sv.classList.remove('on');
    }
  }
}
function renderLog(){
  const b = $('#logBody');
  if (!S.logs.length){ b.innerHTML = '<div style="color:var(--tx3)">暂无日志。</div>'; return; }
  b.innerHTML = S.logs.map(l =>
    '<div class="ln ' + l.k + '"><span class="t">' + l.t + '</span><span class="m">' + esc(l.m) + '</span></div>').join('');
  b.scrollTop = b.scrollHeight;
}
function renderHist(){
  const b = $('#histBody');
  if (!S.history.length){ b.innerHTML = '<div class="empty">还没有生成记录</div>'; return; }
  b.innerHTML = S.history.slice().reverse().map(h =>
    '<div class="hist"><b>' + esc(h.name) + '</b> · ' + h.kind + ' · ' + h.ts +
    (h.usage && Object.keys(h.usage).length ? '<br>' + esc(JSON.stringify(h.usage)) : '') +
    (h.kind === 'video' ? '<video src="' + h.url + '" controls preload="metadata"></video>'
                        : '<img class="hi" src="' + h.url + '" onclick="window.open(this.src,\'_blank\')">') +
    '</div>').join('');
}

/* ===================== 启动 ===================== */
function boot(){
  document.getElementById('root').innerHTML =
  '<div class="top" id="top">' +
    '<div class="brand"><span class="dot"></span>Wan3.0 节点画布</div>' +
    '<input class="inp" id="proj" style="width:160px;height:30px;padding:4px 9px">' +
    '<span class="spacer"></span>' +
    '<span class="tag" id="keytag">检测中…</span>' +
    '<button class="btn sm" id="histBtn">历史</button>' +
    '<button class="btn sm" id="autoBtn">自动排版</button>' +
    '<button class="btn sm" id="saveBtn" title="保存并覆盖当前 JSON">保存</button>' +
    '<button class="btn sm" id="expBtn" title="另存一份到下载目录">导出</button>' +
    '<button class="btn pri" id="runbtn">▶ 运行工作流</button>' +
  '</div>' +
  '<div class="main">' +
    '<div class="rail">' +
      '<button class="rbtn" id="addBtn" title="添加块（T/I/V/P/U）">＋</button>' +
      '<button class="rbtn" id="linkBtn" title="从块的右侧紫点拖到目标块即可连线">⇢</button>' +
      '<button class="rbtn" id="impBtn" title="导入工作流 JSON（导入后保存即可覆盖原文件）">↥</button>' +
      '<button class="rbtn" id="helpBtn" title="用法">?</button>' +
    '</div>' +
    '<div class="col">' +
      '<div class="canvasWrap" id="canvasWrap">' +
        '<div class="addPanel" id="addPanel"></div>' +
        '<div class="world" id="world">' +
          '<svg id="edges"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
          '<path d="M0,0 L10,5 L0,10 z" fill="#8b7fff"/></marker></defs></svg>' +
        '</div>' +
        '<div class="hud" id="hud"></div>' +
        '<div class="dropHint" id="dropHint">松开鼠标，把文件放到这里<br/>图片 / 视频 / 音频都会变成素材源块</div>' +
        '<div class="nav"><button id="zin">+</button><button id="zout">−</button><button id="zfit">⤢</button></div>' +
        '<div class="zinfo" id="zinfo">100%</div>' +
        '<div class="sheet" id="histSheet"><div class="sheetHead">历史<span class="spacer" style="flex:1"></span>' +
          '<button class="btn sm" id="histClose">关闭</button></div><div class="sheetBody" id="histBody"></div></div>' +
      '</div>' +
      '<div class="log" id="log">' +
        '<div class="logHead"><b>运行日志</b><span class="spacer" style="flex:1"></span>' +
          '<button class="btn sm" id="logToggle">收起</button>' +
          '<button class="btn sm" id="clearLog">清空</button></div>' +
        '<div class="logBody" id="logBody"></div>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<div class="ctx" id="ctx"></div>' +
  '<div class="lb" id="lb">' +
    '<button class="lbClose" id="lbClose" title="关闭（Esc）">×</button>' +
    '<img id="lbImg" alt="">' +
    '<div class="lbBar"><a class="btn sm" id="lbDown">下载原图</a>' +
      '<button class="btn sm" id="lbX">关闭</button></div>' +
    '<div class="lbName" id="lbName"></div>' +
  '</div>' +
  '<div class="modal" id="help"><div class="modalCard">' +
    '<h3>用法</h3>' +
    '<p><b>加块</b>：左栏 <code>＋</code> 打开面板，或直接按 <code>T</code> 文本块 / <code>I</code> 图片块 / <code>V</code> 视频块 / <code>U</code> 本地上传。</p>' +
    '<p><b>接素材</b>：把图片、视频、音频文件直接拖到画布上，会变成素材源块。</p>' +
    '<p><b>连线</b>：从块右侧的紫点拖到目标块。连上以后：文本块的内容会<b>实时镜像</b>进下游输入框（灰底只读）；图片/视频/音频块会成为参考素材。</p>' +
    '<p><b>图生视频</b>：视频块里点「图生视频」，左边会自动冒出一个空图片块并接到<b>首帧</b>，尾帧可再连一张。运行时只连首帧会<b>自动降级</b>为首帧生视频。</p>' +
    '<p><b>调参数</b>：鼠标悬停或选中生成块，块上方会浮出工具条，模型/模式/时长/分辨率/比例/配音都在那儿。</p>' +
    '<p><b>右键块</b>：复制、创建副本、重命名、删除。</p>' +
    '<p><b>改名</b>：<b>双击块名</b>，或按 <code>R</code>，或右键「重命名」。回车保存、Esc 放弃。' +
      '刻意没用 <code>F2</code>——那排功能键基本都被系统和软件抢走，按不到。</p>' +
    '<p><b>删连线</b>：点选后按 <code>Delete</code>、点连线中点的 ✕，或点画布空白处取消。</p>' +
    '<p><b>导入 / 保存 / 导出</b>：左栏 <code>↥</code> 导入已有 JSON，导入后点顶栏「保存」会<b>原地覆盖那个文件</b>（按钮悬停会显示要覆盖的文件名）；「导出」则永远是另存一份到下载目录。' +
      (FSA_OK ? '' : '<span style="color:var(--warn)">当前浏览器不支持原地覆盖，保存会退回下载。</span>') + '</p>' +
    '<p style="color:var(--warn)">成本提示：一次只跑一个生成任务。视频按秒计费，跑之前先看块内「预计 ¥」。</p>' +
  '</div></div>';

  // 添加面板
  const pal = $('#addPanel');
  PALETTE.forEach(p => {
    const b = document.createElement('button');
    b.className = 'palItem'; b.draggable = true;
    b.innerHTML = '<div class="ico" style="color:' + p.color + '">' + p.ico + '</div>' +
      '<div style="flex:1"><b>' + p.label + '</b><span>' + p.desc + '</span></div><kbd>' + p.key + '</kbd>';
    b.onclick = () => { if (p.type === 'upload') pickFiles(); else addNode(p.type); closeAdd(); };
    b.ondragstart = e => e.dataTransfer.setData('text/node', p.type);
    pal.appendChild(b);
  });

  $('#proj').value = S.proj;
  $('#proj').oninput = e => { S.proj = e.target.value; };
  $('#runbtn').onclick = runAll;
  $('#autoBtn').onclick = autoLayout;
  $('#saveBtn').onclick = saveWf;
  $('#expBtn').onclick = exportWf;
  $('#impBtn').onclick = importWfPicker;
  $('#helpBtn').onclick = () => $('#help').classList.add('show');
  $('#help').onclick = e => { if (e.target.id === 'help') $('#help').classList.remove('show'); };
  $('#lb').onclick = e => { if (e.target.id === 'lb' || e.target.id === 'lbImg') closeLightbox(); };
  $('#lbClose').onclick = closeLightbox;
  $('#lbX').onclick = closeLightbox;
  $('#lbDown').onclick = () => {
    const a = document.createElement('a');
    a.href = $('#lbImg').src;
    a.download = ($('#lbName').textContent || 'preview').replace(/\.[^.]+$/, '') + '.png';
    a.click();
  };
  $('#histBtn').onclick = () => { $('#histSheet').classList.toggle('show'); renderHist(); };
  $('#histClose').onclick = () => $('#histSheet').classList.remove('show');
  $('#addBtn').onclick = () => { $('#addPanel').classList.toggle('show'); renderTop(); };
  $('#linkBtn').onclick = () => toast('从块的右侧紫点拖到目标块即可连线。首帧/尾帧各只接受 1 张图。', 'dim');
  $('#clearLog').onclick = () => { S.logs = []; renderLog(); };
  $('#logToggle').onclick = () => {
    const lg = $('#log');
    lg.classList.toggle('collapsed');
    $('#logToggle').textContent = lg.classList.contains('collapsed') ? '展开' : '收起';
  };
  $('#zin').onclick = () => { S.view.k = Math.min(2, S.view.k*1.15); applyView(); };
  $('#zout').onclick = () => { S.view.k = Math.max(0.25, S.view.k/1.15); applyView(); };
  $('#zfit').onclick = () => { autoLayout(); S.view = { x:90, y:46, k:1 }; applyView(); };

  document.addEventListener('click', e => {
    if (!e.target.closest('#addPanel') && !e.target.closest('#addBtn')) closeAdd();
    if (!e.target.closest('#ctx')) closeCtx();
    if (!e.target.closest('.bar') && !e.target.closest('.pop') && S.pop) closePop();
  });

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toUpperCase();
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable;
    if (e.key === 'Escape'){
      closeCtx();
      if ($('#lb').classList.contains('show')){ closeLightbox(); return; }
      if ($('#help').classList.contains('show')) $('#help').classList.remove('show');
      if (S.pop){ closePop(); return; }
      if (S.sel || S.selEdge){ S.sel = null; S.selEdge = null; render(); }
      return;
    }
    if (typing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c'){
      if (S.sel){ e.preventDefault(); copyNode(S.sel); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v'){
      e.preventDefault(); pasteNode(); return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace'){
      if (S.selEdge){ delEdge(S.selEdge); e.preventDefault(); }
      else if (S.sel){ delNode(S.sel); e.preventDefault(); }
      return;
    }
    // 重命名用 R 而不是 F2：F2 那排功能键基本都被系统和软件抢占了（编辑器里 F2 常是重命名、
    // 终端里是粘注、某些软件里被禁用），用户按不到。裸字母键最稳，和 T/I/V/P/U 一组。
    if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey && S.sel){
      e.preventDefault(); startRename(S.sel); return;
    }
    const k = e.key.toLowerCase();
    if (PALETTE.some(p => p.key.toLowerCase() === k)){
      e.preventDefault();
      const p = PALETTE.find(x => x.key.toLowerCase() === k);
      if (p.type === 'upload') pickFiles(); else addNode(p.type);
    }
  });

  initCanvas();
  // 起步：文本块 + 视频块，连一条线演示数据流。
  // 文本块刻意留空——不要预填示例文案，用户要的是干净的工作台。
  const t = addNode('text', 90, 130);
  const v = addNode('video', 430, 130);
  S.sel = v.id;
  addEdge(t.id, v.id, 'in');
  autoLayout();
  render();
  L('已就绪。左栏 ＋ 加块，拖文件进画布加素材；按 ? 看用法', 'ok');

  // 状态必须在 fetch 回来之后再打印，避免和角标自相矛盾
  fetch('/api/config')
    .then(r => r.json())
    .then(j => {
      S.backend = true;
      S.hasKey = !!j.hasKey;
      ['videoModels','resolutions','ratios','videoCost','imageModels','imageRatios','imageResolutions','imageSizePresets','imageCost'].forEach(k => {
        if (j[k]) S.cfg[k] = j[k];
      });
      render();
      L(S.hasKey ? 'API Key 已配置，可以生成' : '后端已连接，但未检测到 API Key —— 请复制 .env.example 为 .env 填入后重启服务', S.hasKey ? 'ok' : 'err');
    })
    .catch(() => {
      S.backend = false;
      S.hasKey = false;
      render();
      L('连不上后端服务。你多半是直接双击 index.html 打开的 —— 请先在项目目录执行 python backend.py，再访问 http://127.0.0.1:8000', 'err');
    });

  // 恢复「上次保存到哪个文件」，这样刷新后保存仍然覆盖同一个文件
  restoreFileHandle();

  // 供无头浏览器验收使用的只读探针（不暴露任何写能力）
  window.__wf = {
    S, addNode, resolveVideo, canConnect, nodePorts, role, mirrorText, imgTexts, textNegOn, topo, isGen,
    imgWay, canGenerate, costText, upsOf, edgeOf, upstreamImages, upstreamMedia,
    imgSizeOf, sizeClass, legacyImgSpec,
    addEdge, render, softSync, delNode, delEdge, copyNode, duplicateNode,
    uploadFiles, fillSlot, mediaHTML, bringToFront,
    loadWfText, wfText, saveWf, setCurrentFile, FSA_OK, renderTop, renderHud,
    cost: (model) => {
      const n = S.nodes.find(x => x.type === 'video');
      const params = Object.assign({}, n ? n.params : { resolution:'720P', duration:5 }, model ? { model:model } : null);
      return { video: videoCost({ params:params }) };
    },
  };
}
function closeAdd(){ $('#addPanel').classList.remove('show'); renderTop(); }
boot();
</script>
