<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Wan3.0 节点画布创作台</title>
<style>
:root{
  --bg:#141414; --panel:#1c1c1e; --panel2:#242426; --line:#333336;
  --tx:#e9e9ea; --tx2:#9a9a9f; --tx3:#6b6b70;
  --ac:#6a5cff; --ac2:#8b7fff; --ok:#3fb950; --err:#f85149; --warn:#d29922;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* 关键：#root 必须是确定高度，否则子元素的百分比/calc 会退化成 auto，内容收缩时下半屏塌陷变黑 */
#root{height:100%;display:flex;flex-direction:column;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a3a3d;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 0 12px var(--ac)}
.spacer{flex:1}
.btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:#2b2b2e;border-color:#4a4a4f}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--ac2)}
.btn.sm{height:27px;padding:0 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 保存：已绑定文件时点亮，保存成功闪一下绿 */
.btn.on{border-color:var(--ac);color:var(--ac)}
.btn.flash{background:var(--ac);border-color:var(--ac);color:#fff;transition:background .1s}
.inp{width:100%;background:#17171a;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;outline:none;transition:.15s}
.inp:focus{border-color:var(--ac)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#1d4429}
.tag.err{color:var(--err);border-color:#5c1f1c}
.tag.run{color:var(--warn);border-color:#4a3a12}

/* ---------- 主区 ---------- */
.main{flex:1;min-height:0;display:flex}
.rail{width:58px;flex:none;min-height:0;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
.rbtn{width:38px;height:38px;border-radius:10px;color:var(--tx2);display:grid;place-items:center;font-size:17px;transition:.15s}
.rbtn:hover{background:var(--panel2);color:var(--tx)}
.rbtn.on{background:var(--ac);color:#fff}
.col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}

/* ---------- 添加面板 ---------- */
.addPanel{position:absolute;left:66px;top:8px;z-index:30;width:214px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;box-shadow:0 12px 34px #0009;display:none}
.addPanel.show{display:block}
.palItem{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:grab;transition:.15s;text-align:left;width:100%;margin-bottom:6px}
.palItem:hover{border-color:var(--ac);background:#26262a}
.palItem .ico{width:24px;height:24px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:13px;background:#2e2e33}
.palItem b{font-size:12.5px;font-weight:600;display:block}
.palItem span{font-size:11px;color:var(--tx3);display:block;line-height:1.35;margin-top:1px}
.palItem kbd{float:right;font-size:10px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* ---------- 画布 ---------- */
.canvasWrap{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(circle at 1px 1px,#2a2a2e 1px,transparent 0) 0 0/20px 20px}
.world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.world svg{position:absolute;top:0;left:0;overflow:visible;width:1px;height:1px}
.nav{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:5px;z-index:6}
.nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);font-size:15px;display:grid;place-items:center}
.nav button:hover{border-color:var(--ac);color:var(--tx)}
.zinfo{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--tx3);background:#1c1c1ecc;padding:3px 8px;border-radius:6px;border:1px solid var(--line);z-index:5}
.dropHint{position:absolute;inset:10px;border:2px dashed var(--ac);border-radius:14px;background:#6a5cff14;display:none;place-items:center;z-index:8;font-size:14px;color:var(--tx2);pointer-events:none}
.dropHint.show{display:grid}

/* ---------- HUD（屏幕坐标，不随画布缩放） ---------- */
.hud{position:absolute;inset:0;pointer-events:none;z-index:10}
.hud > *{pointer-events:auto}
.bar{position:absolute;display:flex;align-items:center;gap:3px;background:#1f1f22f2;border:1px solid var(--line);border-radius:20px;padding:4px 6px;box-shadow:0 8px 24px #000a;backdrop-filter:blur(6px)}
.bar .grip{width:9px;height:18px;border-radius:4px;background:#3a3a3f;cursor:grab;flex:none;margin-right:1px}
.bar .grip:active{cursor:grabbing}
.ctl{height:26px;padding:0 9px;border-radius:14px;color:var(--tx);font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:.12s}
.ctl:hover{background:#2e2e33}
.ctl.on{background:#2b2b30;color:var(--tx)}
.ctl.dis{opacity:.35;cursor:not-allowed}
.ctl .caret{font-size:8px;color:var(--tx3)}
.ctl .cdot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}
.ctl.arm .cdot{background:var(--ac)}
.pop{position:absolute;background:#1f1f22f8;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 12px 30px #000b;backdrop-filter:blur(6px);min-width:126px;max-height:330px;overflow-y:auto}
.popItem{width:100%;text-align:left;padding:7px 9px;border-radius:7px;font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:8px}
.popItem:hover{background:#2e2e33;color:var(--tx)}
.popItem.on{color:var(--tx)}
.popItem .ck{width:14px;flex:none;color:var(--ac)}
.popItem .badge{font-size:9px;color:var(--ok);border:1px solid #1d4429;border-radius:4px;padding:0 3px}
.popSlider{padding:10px 12px 12px;width:212px}
.popSlider .val{font-size:19px;font-weight:650;margin-bottom:9px}
.popSlider .val small{font-size:11px;color:var(--tx3);font-weight:400;margin-left:4px}
.popSlider input[type=range]{width:100%;accent-color:var(--ac)}
.popSlider .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);margin-top:2px}
.popTitle{padding:6px 9px 4px;font-size:10px;color:var(--tx3);letter-spacing:.5px}

/* ---------- 右键菜单 ---------- */
.ctx{position:fixed;z-index:60;min-width:158px;background:#1f1f22fa;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 14px 36px #000c;display:none;backdrop-filter:blur(6px)}
.ctx.show{display:block}
.ctxItem{width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:9px}
.ctxItem:hover{background:var(--ac);color:#fff}
.ctxItem.danger:hover{background:var(--err)}
.ctxItem .ck{margin-left:auto;font-size:10px;color:var(--tx3)}
.ctxItem:hover .ck{color:#fff9}
.ctxSep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- 节点 ---------- */
.node{position:absolute;width:260px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:visible;box-shadow:0 6px 22px #0006;transition:border-color .15s,box-shadow .15s}
.node.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 8px 26px #0007}
.node.st-run{border-color:var(--warn)}
.node.st-done{border-color:#1d4429}
.node.st-err{border-color:#5c1f1c}
.nHead{display:flex;align-items:center;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line);background:#26262a;border-radius:11px 11px 0 0;cursor:grab}
.nHead:active{cursor:grabbing}
.nHead .ico{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:11px;background:#333338;flex:none}
/* 名称不占满整行（原来 flex:1 会把标题栏的空白也吃进来，悬停时是一条很宽的灰条，
   一眼看不出哪里能双击）。改成按内容收紧，靠 .nRole 的 margin-left:auto 把角色标签顶到右边，
   排版效果一样，但名称的命中区由 padding 决定，边界清晰。
   flex:0 1 auto + min-width:0 是为了名字过长时仍然省略号截断而不是把角色标签挤走。 */
.nHead b{font-size:12.5px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nRole{font-size:9.5px;padding:1px 5px;border-radius:10px;border:1px solid var(--line);color:var(--tx3);flex:none;white-space:nowrap;margin-left:auto}
.nRole.src{border-color:#1d4429;color:var(--ok)}
.nRole.gen{border-color:#4a3a12;color:var(--warn)}
/* 块名：可双击重命名。命中区用 padding 撑大、负 margin 抵消掉，排版不受影响。 */
.nName{padding:5px 12px;margin:-5px -12px;border-radius:6px;cursor:text}
.nName:hover{background:#ffffff14}
/* 重命名态：原站双击块名后名称会整块变蓝（见原站截图 2026-10-16 221625），
   所以这里用蓝调底色 + 蓝色文字，而不是普通的深色输入框。 */
.nRename{width:100%;background:#2c3054;border:1px solid var(--ac);border-radius:5px;
  padding:1px 4px;font-size:12.5px;outline:none;color:#aebcff;caret-color:var(--ac)}
.nRename::placeholder{color:#6a6f9c}
.nBody{padding:9px 10px;display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--tx2)}
textarea.prompt{width:100%;min-height:62px;resize:vertical;background:#17171a;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.55;outline:none;color:var(--tx)}
textarea.prompt:focus{border-color:var(--ac)}
textarea.prompt.mirror{background:#1b1b1f;color:var(--tx3);border-style:dashed;cursor:not-allowed}
textarea.prompt:disabled{opacity:.6}
/* 负向提示词那一截：上面一条小标签，下面一个比提示词矮的框。
   灰底虚线沿用 .mirror，被上游镜像时看起来是「只读、不是这里编辑的」。 */
.negWrap{display:flex;flex-direction:column;gap:4px}
.negLb{font-size:10.5px;color:var(--tx3);letter-spacing:.2px}
textarea.prompt.neg{min-height:42px;font-size:11.5px;color:var(--tx2)}
/* 多参考模式：原站在输入框左上角先摆一个「输入」标签和一个 @ 徽章，
   placeholder 跟在它们后面。见截图 2026-10-16 220957。 */
.promptBox{position:relative}
.promptPre{position:absolute;left:9px;top:8px;display:flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--tx3);pointer-events:none;z-index:1}
.promptPre .at{width:15px;height:15px;border-radius:50%;background:#2f6bff;color:#fff;
  font-size:10px;font-style:normal;line-height:15px;text-align:center}
.promptBox.hasPre textarea.prompt{padding-left:52px}
/* 多参考模式的输入框用 contenteditable，才能在里面放真正的内联芯片。
   textarea 只能存纯文本，做不出 @图片1 那种方块。 */
.pEdit{min-height:62px;background:#17171a;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:12px;line-height:1.55;color:var(--tx);outline:none;
  white-space:pre-wrap;word-break:break-word}
.pEdit:focus{border-color:var(--ac)}
.pEdit:empty::before{content:attr(data-ph);color:var(--tx3)}
.promptBox.hasPre .pEdit{padding-left:52px}
/* 引用芯片：不可编辑的原子，文本序列化成 @图片1，纯文字界面读到的也是这个 */
.mChip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;margin:0 1px;
  border-radius:10px;border:1px solid var(--line);background:#1f1f23;font-size:11px;
  vertical-align:middle;user-select:none;cursor:pointer;width:auto;max-width:170px}
.mChip img{width:13px;height:13px;border-radius:3px;object-fit:cover;flex:none}
/* 类名必须带 m 前缀：.lb 已经被「灯箱预览」占了（display:none 的全屏层），
   直接叫 .lb 会被那条规则整个隐藏掉 —— 表现就是芯片只剩一个小缩略图方块。
   flex:none 也要留着：overflow:hidden 会让 min-width:auto 失效，不锁死标签会被 flex 压扁。 */
.mChip .mLb{flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.45}
.mChip.img{border-color:#5c3a1d;color:#c98a4b}
.mChip.vid{border-color:#3a2a5c;color:#9b86e0}
.mChip.aud{border-color:#1d4436;color:#4fbf8a}
/* 输入 @ 弹出的选择列表 */
.atPop{position:absolute;left:9px;top:36px;z-index:6;min-width:168px;max-height:196px;overflow:auto;
  background:#1e1e22;border:1px solid var(--line);border-radius:9px;padding:4px;
  box-shadow:0 10px 28px #0009;display:none}
.atPop.show{display:block}
.atPop .atTitle{font-size:10px;color:var(--tx3);padding:4px 7px 2px}
.atPop .atItem{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;
  cursor:pointer;font-size:11.5px;color:var(--tx2)}
.atPop .atItem:hover{background:#2d2d33;color:var(--tx)}
.atPop .atItem img{width:24px;height:24px;border-radius:5px;object-fit:cover;background:#1a1a1c;flex:none}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#17171a;font-size:12px;color:var(--tx2);transition:.12s}
.opt:hover{border-color:var(--ac);color:var(--tx);background:#1f1f24}
.opt.on{border-color:var(--ac);color:var(--ac)}
.optRow{display:flex;align-items:center;gap:6px;margin-top:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--tx3);background:#17171a}
.chip.img{border-color:#5c3a1d;color:#c98a4b}
.chip.vid{border-color:#3a2a5c;color:#9b86e0}
.chip.aud{border-color:#1d4436;color:#4fbf8a}
.genBtn{margin-left:auto;width:28px;height:28px;border-radius:8px;background:var(--ac);color:#fff;font-size:14px;display:grid;place-items:center;flex:none}
.genBtn:hover{background:var(--ac2)}
.genBtn:disabled{background:#3a3a3f;color:var(--tx3);cursor:not-allowed}
.cost{font-size:11px;color:var(--tx3)}
.cost b{color:var(--tx2)}
.frames{display:flex;flex-direction:column;gap:5px}
.fslot{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;border:1.5px dashed var(--line);border-radius:8px;background:#17171a}
.fslot.filled{border-style:solid;border-color:#3d5c3f;background:#141a15}
/* 首帧/尾帧的连接点：绝对定位挂到 .node 上，left 与 .port.in 一模一样，
   于是它和进出端口落在同一条竖轴上（也就是块的边框上）。
   注意 .fslot 上绝不能再有 position:relative —— 那会把 offsetParent 截在行内，
   圆点就推不到块边框去了。垂直位置由 placeFrameDots() 按所在行的中心实时算。 */
.fdot{position:absolute;left:-7px;top:0;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--panel2);transform:translateY(-50%);cursor:crosshair;z-index:3}
.fdot:hover{background:var(--ac2);transform:translateY(-50%) scale(1.3)}
.fdot::after{content:"";position:absolute;inset:-8px}
.fslot .ftxt{font-size:11px;color:var(--tx3);flex:none}
.fslot .fthumb{width:26px;height:26px;border-radius:5px;background:#1a1a1c center/cover;border:1px solid var(--line);flex:none}
.fslot .fstate{font-size:10px;color:var(--tx3);margin-left:auto;flex:none}
/* 素材源块：原站那样把素材本体铺满整个块，不加文字也不加按钮 */
.mediaWrap{margin:-9px -10px;border-radius:0 0 11px 11px;overflow:hidden}
.mediaFull{width:100%;display:block;background:#0d0d0f;cursor:zoom-in}
.mediaFull.img{max-height:400px;object-fit:contain}
.mediaFull.vid{max-height:260px;object-fit:contain;cursor:pointer}
.audioCard{display:flex;align-items:center;gap:9px;padding:14px 12px;background:#0d0d0f}
.audioCard .ico{width:38px;height:38px;border-radius:50%;background:#1d4436;color:#4fbf8a;display:grid;place-items:center;font-size:17px;flex:none}
.mediaName{flex:1;min-width:0;font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 灯箱预览 */
.lb{position:fixed;inset:0;background:#000000e8;z-index:90;display:none;place-items:center;padding:44px 44px 84px}
.lb.show{display:grid}
.lb img{max-width:92vw;max-height:78vh;border-radius:10px;box-shadow:0 24px 70px #000}
.lbClose{position:absolute;top:16px;right:20px;width:38px;height:38px;border-radius:50%;background:#2a2a30;color:#fff;font-size:19px;display:grid;place-items:center}
.lbClose:hover{background:var(--err)}
.lbBar{position:absolute;bottom:44px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.lbName{position:absolute;bottom:0;left:0;right:0;padding:0 20px 16px;text-align:center;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:3px 7px;align-self:flex-start}
.mini:hover{border-color:var(--ac);color:var(--tx2)}
.mini.del:hover{border-color:var(--err);color:var(--err);background:#2a1311}
.player{position:relative;border-radius:9px;overflow:hidden;background:#000}
.player video{width:100%;display:block;max-height:280px}
.volRow{display:flex;align-items:center;gap:7px;padding:5px 7px;background:#111113;font-size:10.5px;color:var(--tx3)}
.volRow input[type=range]{flex:1;accent-color:var(--ac)}
.hint1{font-size:10.5px;color:var(--tx3);line-height:1.6}
.err1{font-size:10.5px;color:var(--err);line-height:1.6;word-break:break-all}
.spin{width:13px;height:13px;border:2px solid #3a3a3f;border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* 端口 */
.port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--ac);border:2px solid var(--panel2);top:50%;transform:translateY(-50%);cursor:crosshair;z-index:3}
.port:hover{background:var(--ac2);transform:translateY(-50%) scale(1.35)}
.port.in{left:-7px}
.port.out{right:-7px}
.port::after{content:"";position:absolute;inset:-8px}
/* 连线 */
.edgeHit{fill:none;stroke:transparent;stroke-width:20;cursor:pointer}
.edgeDel{position:absolute;width:22px;height:22px;border-radius:50%;background:#3a2226;color:var(--err);border:2px solid var(--panel);font-size:13px;line-height:1;display:grid;place-items:center;transform:translate(-50%,-50%);z-index:4;cursor:pointer}
.edgeDel:hover{background:var(--err);color:#fff}

/* ---------- 历史面板 ---------- */
.sheet{position:absolute;right:0;top:0;bottom:0;width:330px;background:var(--panel);border-left:1px solid var(--line);z-index:20;display:none;flex-direction:column}
.sheet.show{display:flex}
.sheetHead{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}

<body>
<div id="root"></div>

<script>
"use strict";

/* ===================== 常量 ===================== */
const NW = 260;                       // 节点宽（连线锚点与排版用）
const POLL_MS = 4000;                 // 轮询间隔

const DEFAULT_CFG = {
  videoModels: [{ id:'wan3.0-video', name:'Wan 3.0' }, { id:'wan3.0-video-prime', name:'Wan 3.0 Prime' }],
  resolutions: [{ label:'高清', value:'1080P' }, { label:'标准', value:'720P' }, { label:'流畅', value:'480P' }],
  ratios: ['adaptive','16:9','4:3','1:1','3:4','9:16'],
  videoCost: { 'wan3.0-video':{'480P':0.21,'720P':0.42,'1080P':0.84},
               'wan3.0-video-prime':{'480P':0.45,'720P':0.90,'1080P':1.80} },
  imageModels: [{ id:'qwen-image-3.0-pro', name:'Qwen-Image 3.0 Pro', maxRefs:3 },
                { id:'qwen-image-3.0', name:'Qwen-Image 3.0', maxRefs:3 },
                { id:'qwen-image-2.1-pro', name:'Qwen-Image 2.1 Pro', maxRefs:10 },
                { id:'qwen-image-2.1-turbo', name:'Qwen-Image 2.1 Turbo', maxRefs:10 }],
  imageRatios: ['auto','16:9','4:3','1:1','3:4','9:16','2:3','3:2'],
  imageResolutions: ['1K','2K'],
  // 比例×档位 → 实际提交的 宽x高。与后端 IMAGE_SIZE_PRESETS 一一对应（#35）。
  // 1K 档刻意避开含 1536/2048 的值，保证 sizeClass() 归到 1K。
  imageSizePresets: { '16:9':{'1K':'1696x960','2K':'2048x1152'},
                      '9:16':{'1K':'960x1696','2K':'1152x2048'},
                      '1:1': {'1K':'1280x1280','2K':'2048x2048'},
                      '4:3': {'1K':'1472x1104','2K':'2048x1536'},
                      '3:4': {'1K':'1104x1472','2K':'1536x2048'},
                      '2:3': {'1K':'1088x1632','2K':'1360x2048'},
                      '3:2': {'1K':'1728x1152','2K':'2048x1360'} },
  imageCost: { 'qwen-image-3.0-pro':  { out:{ '1K':0.25, '2K':0.50 }, in:0.02 },
               'qwen-image-3.0':      { out:{ '1K':0.18, '2K':0.18 }, in:0.02 },
               'qwen-image-2.1-pro':  { out:{ '1K':0.25, '2K':0.25 }, in:0    },
               'qwen-image-2.1-turbo':{ out:{ '1K':0.10, '2K':0.10 }, in:0    } },
};
const RES_LABEL = { '1080P':'高清', '720P':'标准', '480P':'流畅' };
const RATIO_LABEL = { adaptive:'自适应', '16:9':'16:9', '4:3':'4:3', '1:1':'1:1', '3:4':'3:4', '9:16':'9:16' };
const PORT_LABEL = { in:'输入', first:'首帧', last:'尾帧' };
const ACCEPT = { image:'image/jpeg,image/png,image/webp,image/bmp',
                 video:'video/mp4,video/quicktime', audio:'audio/wav,audio/mpeg' };
const LIMIT_MB = { image:20, video:100, audio:15 };
const STYLE_SUFFIX = '，保持原图构图与主体特征，转换为高质量插画风格，细节精致';

/* 负向提示词默认值。官方示例给的就是这句，新建块直接填好，省得每次手输。
   qwen-image 全系列都支持（官方只排除了 wan2.7-image-pro / wan2.7-image）。 */
const DEFAULT_NEG = 'Low resolution, low quality, distorted limbs, malformed fingers, oversaturated colors, wax-figure appearance, lack of facial detail, excessive smoothness, AI-looking artifacts, chaotic composition, blurry or warped text.';

const PALETTE = [
  { type:'text', label:'文本块', ico:'T', color:'#3fb950', key:'T', desc:'唯一文本源，输入提示词' },
  { type:'image', label:'图片块', ico:'I', color:'#e8933a', key:'I', desc:'空则生图，有图则供源' },
  { type:'video', label:'视频块', ico:'V', color:'#8b7fff', key:'V', desc:'有提示词则生成，有视频则供源' },
  { type:'template', label:'模版块', ico:'P', color:'#8a8a90', key:'P', desc:'预留，暂未实现' },
  { type:'upload', label:'本地上传', ico:'U', color:'#4fb0c6', key:'U', desc:'上传图片/视频/音频作为素材源' },
];

/* ===================== 状态 ===================== */
const S = {
  nodes: [], edges: [], sel: null, selEdge: null, hover: null,
  view: { x: 90, y: 46, k: 1 },
  drag: null,
  zTop: 0,                       // 叠放次序计数器，数字越大越靠上
  logs: [], running: false, hasKey: null, backend: null, cfg: DEFAULT_CFG,
  proj: '未命名项目', history: [], clipboard: null,
  pop: null, ctx: null, renaming: null, dropOver: false,
  dbl: null,                    // 上一次落在块名上的按下，用来手工判双击（见 initCanvas）
  at: null, atNode: null,        // @ 引用：触发信息 { node, start } 和当前打开列表的块 id
  fileHandle: null,        // 当前工作流文件的 FileSystemFileHandle，保存时原地覆盖
  fileName: '',            // 目标文件名，给用户看清楚会覆盖谁
  fileNodeCount: 0,        // 上次保存时有多少个块 —— 防止误把空画布覆盖上去
};
let uid = 1;
const nid = () => 'n' + (uid++);

/* ===================== 工具 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const nodeById = id => S.nodes.find(n => n.id === id);
const clone = o => JSON.parse(JSON.stringify(o));

function L(msg, kind){
  S.logs.push({ t:new Date().toLocaleTimeString('zh-CN',{hour12:false}), m:msg, k:kind || '' });
  if (S.logs.length > 300) S.logs.shift();
  renderLog();
}
function toast(msg, kind){
  L(msg, kind);
}

/* ===================== 角色推导（核心） ===================== */
function role(n){
  if (n.type === 'text') return 'text';
  if (n.type === 'image') return n.img ? 'imageSrc' : 'imageGen';
  if (n.type === 'video') return n.vid ? 'videoSrc' : (n.aud ? 'audioSrc' : 'videoGen');
  return 'template';
}
const nodeName = n => n.name || (PALETTE.find(p => p.type === n.type) || { label:n.type }).label;
const ROLE_LABEL = { text:'文本源', imageSrc:'参考图源', imageGen:'图像生成', videoSrc:'参考视频源', audioSrc:'参考音频源', videoGen:'视频生成', template:'模版' };

function upsOf(id, port){
  return S.edges.filter(e => e.to === id && (port === undefined || e.toPort === port)).map(e => nodeById(e.from)).filter(Boolean);
}
/**
 * 原站规则：块只要和任何节点连上（无论这条边是进还是出），块内的入口按钮就全部收起。
 * 图片块与视频块同规则——往下游送料时它虽然是源，原站照样不显示入口。
 */
const hasAnyEdge = id => S.edges.some(e => e.from === id || e.to === id);
function edgeOf(id, port){
  return S.edges.find(e => e.to === id && e.toPort === port);
}

/** 该节点开放哪些输入端口 */
function nodePorts(n){
  if (n.type === 'image') return ['in'];
  if (n.type === 'video') return (n.showFrames || n.params.mode === 'fl') ? ['in','first','last'] : ['in'];
  return [];
}

/**
 * 连线合法性 —— 首帧/尾帧各只接受 1 张图
 * 注意：空的图片块/视频块是允许连线的（上游跑完才会有内容），
 * 素材是否就绪留到运行时校验，否则会堵死「先生成、再喂给下游」这条主流程。
 */
function canConnect(fromId, toId, toPort){
  const a = nodeById(fromId), b = nodeById(toId);
  if (!a || !b) return '节点不存在';
  if (a.id === b.id) return '不能连到自己';
  if (a.type === 'template') return '模版块暂未实现，暂不能作为素材源';
  if (!nodePorts(b).includes(toPort)) return '「' + nodeName(b) + '」没有「' + PORT_LABEL[toPort] + '」入口';
  if (S.edges.some(e => e.from === a.id && e.to === b.id && e.toPort === toPort)) return '这条连线已经存在';
  if (toPort === 'first' || toPort === 'last'){
    if (a.type !== 'image') return '首帧/尾帧只能连接图片块';
    if (edgeOf(b.id, toPort)) return PORT_LABEL[toPort] + '最多 1 张图，请先删掉已连的那条';
  }
  return '';
}

/**
 * 运行时解析视频模式 —— 优先级高于 UI 上显示的模式。
 * 注意：完全没碰过帧位的新块不该报警告（那就是默认的文生视频），
 * 只有「连了一半」或「主动进过图生视频流程」才提示降级。
 */
function resolveVideo(n){
  const first = edgeOf(n.id, 'first'), last = edgeOf(n.id, 'last');
  if (first && last) return { mode:'fl', note:'' };
  if (first) return { mode:'i2v', note:'未连接尾帧，按首帧生视频模式生成' };
  if (n.params.mode === 'omni') return { mode:'omni', note:'' };
  if (last) return { mode:'t2v', note:'只连了尾帧、缺首帧，按文生视频模式生成' };
  if (n.showFrames) return { mode:'t2v', note:'还没连接任何帧位，当前按文生视频模式生成' };
  return { mode:'t2v', note:'' };
}

/** 文本块是否要显示负向提示词那一截：只要它的下游里有图片块就分两截。 */
function textNegOn(t){
  return S.edges.some(e => e.from === t.id && (nodeById(e.to) || {}).type === 'image');
}

/** 图片块提交时真正用的两段文字。提示词和负向词必须同一个来源，
    分开各判一次的话迟早会对不上（比如镜像只判了提示词那一半）。 */
function imgTexts(n){
  const mt = mirrorText(n);
  return {
    on: mt.on,
    prompt: mt.on ? mt.text : (n.imgPrompt || ''),
    neg: (mt.on ? mt.neg : n.imgParams.negativePrompt) || '',
  };
}

/** 上游文本 —— 连线时实时镜像到下游输入框 */
function mirrorText(n){
  const ups = upsOf(n.id, 'in').filter(u => u.type === 'text');
  const txt = ups.map(u => u.text || '').filter(t => t.trim()).join('\n\n');
  // 负向只收「已经分两截」的上游：单向文本块没开负向那一截，就不该凭空造一段负向词出来
  const neg = ups.filter(u => textNegOn(u)).map(u => u.negText || '').filter(t => t.trim()).join('\n\n');
  return { text:txt, neg:neg, on:ups.length > 0 && txt.length > 0, src:ups };
}

/** 某块是否为生成块（需要出端口 + 悬浮工具条） */
const isGen = n => role(n) === 'imageGen' || role(n) === 'videoGen';

/** 上游图片参考 —— 供图生图 / 参考图生图 / 多参考视频 */
function upstreamImages(n){
  return upsOf(n.id, 'in').filter(u => u.type === 'image' && u.img);
}
function upstreamMedia(n){
  return upsOf(n.id, 'in').filter(u => (u.type === 'image' && u.img) || (u.type === 'video' && (u.vid || u.aud)))
    .map(u => u.aud
      ? { node:u, kind:'audio', chip:'音频', local:u.aud.url }
      : u.vid
        ? { node:u, kind:'video', chip:'视频', local:u.vid.url }
        : { node:u, kind:'image', chip:'图片', local:u.img.url });
}

/* ===================== 多参考：@ 引用 ===================== */
/**
 * 引用芯片和纯文本之间来回转换。
 *
 * 状态里只存**纯文本**，芯片在文本里就是 `@图片1` 这个词（不带空格）。
 * 这样导出/导入、镜像、后端提交全都不用改，芯片只是显示层。
 * 芯片节点额外带 data-ref="图片:1"，序列化时优先用它，不靠正则猜。
 */
const REF_RE = /@(图片|视频|音频)(\d+)/;

function refLabel(m){ return m.kind + ' ' + m.idx; }          // 界面上显示「图片 1」
function refToken(m){ return '@' + m.kind + m.idx; }         // 存进状态的是「@图片1」

function chipNode(m, thumb){
  const s = document.createElement('span');
  s.className = 'mChip ' + (m.cls || '');      // cls 是 img/vid/aud，别拿中文的 kind 当类名
  s.contentEditable = 'false';
  s.dataset.ref = m.kind + ':' + m.idx;
  s.title = '点击移除这个引用';
  if (thumb) s.appendChild(thumb);
  const lb = document.createElement('span');
  lb.className = 'mLb';                           // 别叫 .lb，那已被灯箱占用
  lb.textContent = refLabel(m);
  s.appendChild(lb);
  return s;
}
function thumbOf(url){
  const im = document.createElement('img');
  im.src = url;
  return im;
}
/** 编辑器 DOM -> 纯文本（芯片折成 @图片1） */
function editToText(ed){
  let out = '';
  (function walk(node){
    node.childNodes.forEach(c => {
      if (c.nodeType === 3){ out += c.nodeValue; return; }
      if (c.nodeType !== 1) return;
      const ref = c.dataset && c.dataset.ref;
      if (ref){
        const i = ref.indexOf(':');
        out += '@' + ref.slice(0, i) + ref.slice(i + 1);
        return;
      }
      if (c.tagName === 'BR'){ out += '\n'; return; }
      walk(c);
    });
  })(ed);
  return out;
}
/** 纯文本 -> 编辑器 DOM：把 @图片1 之类的词换成芯片，其余原样保留 */
function textToEdit(ed, text, list){
  ed.textContent = '';
  if (!text) return;
  // 一次只认一组引用：按出现顺序把 @图片1 依次对上 list 里的第 N 项
  let rest = String(text), guard = 0;
  while (guard++ < 200){
    const m = rest.match(REF_RE);
    if (!m) break;
    const kind = m[1], idx = parseInt(m[2], 10);
    const hit = list.find(x => x.kind === kind && x.idx === idx);
    if (!hit){                       // 对不上的引用就当普通文字留着，别吞
      const head = rest.slice(0, m.index + m[0].length);
      ed.appendChild(document.createTextNode(head));
      rest = rest.slice(m.index + m[0].length);
      continue;
    }
    if (m.index > 0) ed.appendChild(document.createTextNode(rest.slice(0, m.index)));
    ed.appendChild(chipNode(hit, hit.local ? thumbOf(hit.local) : null));
    rest = rest.slice(m.index + m[0].length);
  }
  if (rest) ed.appendChild(document.createTextNode(rest));
}

/** 给某个视频块算出可引用的上游素材，编号从 1 起，和块内芯片行一致。
    kind 是界面上的中文词（图片/视频/音频），cls 是配色用的 CSS 类（img/vid/aud）。 */
function refList(n){
  return upstreamMedia(n).map((m, i) => ({ kind:m.chip, cls:m.kind, idx:i + 1, node:m.node, local:m.local }));
}

/** 光标前那段文本里有没有刚敲的 @xxx（有就返回触发信息） */
function atTrigger(ed){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!r.collapsed || !ed.contains(r.startContainer)) return null;
  const pre = textBefore(ed, r.startContainer, r.startOffset);
  const m = pre.match(/@([^\s@]*)$/);
  if (!m) return null;
  return { start:pre.length - m[0].length, query:m[1] };
}

/** 从编辑区开头到某个位置的纯文本（芯片按 @图片1 计长） */
function textBefore(root, node, offset){
  const r = document.createRange();
  r.setStart(root, 0);
  try { r.setEnd(node, offset); } catch (e){ return ''; }
  const frag = r.cloneContents();
  const box = document.createElement('div');
  box.appendChild(frag);
  return editToText(box);
}

/** 把编辑器里的纯文本下标换算成 DOM 位置（落在芯片内部就取芯片边界） */
function posToPoint(root, pos){
  let acc = 0, hit = null;
  const walk = (node, parent) => {
    if (hit) return;
    for (let i = 0; i < node.childNodes.length; i++){
      if (hit) return;
      const c = node.childNodes[i];
      if (acc === pos){ hit = { node:parent, offset:i }; return; }
      if (c.nodeType === 3){
        const len = c.nodeValue.length;
        if (pos < acc + len){ hit = { node:c, offset:pos - acc }; return; }
        acc += len;
      } else if (c.nodeType === 1){
        const ref = c.dataset && c.dataset.ref;
        if (ref){
          const t = '@' + ref.replace(':', '');
          if (pos < acc + t.length){ hit = { node:parent, offset:i }; return; }   // 落在芯片内部 -> 取它前面
          if (pos === acc + t.length){ hit = { node:parent, offset:i + 1 }; return; }
          acc += t.length;
        } else if (c.tagName === 'BR'){
          if (pos < acc + 1){ hit = { node:parent, offset:i }; return; }
          acc += 1;
        } else walk(c, node);
      }
    }
  };
  walk(root, root);
  return hit || { node:root, offset:root.childNodes.length };
}

function pickAt(root, pos){
  const r = posToPoint(root, pos);
  const range = document.createRange();
  range.setStart(r.node, r.offset);
  range.collapse(true);
  return range;
}

function closeAt(){
  S.atNode = null;
  document.querySelectorAll('.atPop.show').forEach(p => { p.classList.remove('show'); p.innerHTML = ''; });
}

/** 打开 @ 选择列表（只列有真实内容的上游块） */
function openAt(nodeId, items, query){
  const box = document.querySelector('.promptBox[data-node="' + nodeId + '"]');
  const pop = box && box.querySelector('.atPop');
  if (!pop) return;
  const q = (query || '').trim();
  const hit = items.filter(m => !q || refLabel(m).indexOf(q) >= 0 || refToken(m).indexOf(q) >= 0);
  // 一个可引用的都没有就不弹 —— 原站截图里空块只是「不出现」，没有额外的空列表提示，
  // 这里不去自创一个没依据的界面
  if (!hit.length){ closeAt(); return; }
  // 按类型分组，原站截图里的分组标题就是「图片节点」这种
  const groups = [];
  hit.forEach(m => {
    let g = groups.find(x => x.kind === m.kind);
    if (!g){ g = { kind:m.kind, items:[] }; groups.push(g); }
    g.items.push(m);
  });
  const titleOf = { 图片:'图片节点', 视频:'视频节点', 音频:'音频节点' };
  pop.innerHTML = groups.map(g =>
    '<div class="atTitle">' + (titleOf[g.kind] || g.kind) + '</div>' +
    g.items.map(m => '<div class="atItem" data-idx="' + m.idx + '">' +
      (m.local ? '<img src="' + m.local + '">' : '') +
      '<span>' + refLabel(m) + '</span></div>').join('')
  ).join('');
  pop.classList.add('show');
  S.atNode = nodeId;
}

/** 选中一项：把触发列表的那个 @xxx 换成芯片，其余文字原样保留 */
function insertRef(nodeId, idx){
  const box = document.querySelector('.promptBox[data-node="' + nodeId + '"]');
  const ed = box && box.querySelector('.pEdit');
  if (!ed) return;
  const n = nodeById(nodeId);
  const hit = refList(n).find(m => m.idx === idx);
  if (!hit) return;
  const start = (S.at && S.at.node === nodeId) ? S.at.start : editToText(ed).length;
  const from = pickAt(ed, start);
  const sel = window.getSelection();
  let end = { node:ed, offset:ed.childNodes.length };
  if (sel && sel.rangeCount && ed.contains(sel.getRangeAt(0).startContainer)){
    const r = sel.getRangeAt(0);
    end = { node:r.startContainer, offset:r.startOffset };
  }
  const del = document.createRange();
  del.setStart(from.startContainer, from.startOffset);
  del.setEnd(end.node, end.offset);
  del.deleteContents();
  const chip = chipNode(hit, hit.local ? thumbOf(hit.local) : null);
  del.insertNode(chip);
  // 芯片后面补一个空格，免得紧接着打的字贴在方块上
  del.collapse(false);
  del.insertNode(document.createTextNode(' '));
  const after = document.createRange();
  after.setStartAfter(chip);
  after.collapse(true);
  sel.removeAllRanges(); sel.addRange(after);
  n.prompt = editToText(ed);
  S.at = null;
  closeAt();
  ed.focus();
  softSync();
}

/** 点芯片移除：删掉这个方块，文字照旧拼回去 */
function removeChip(nodeId, chip){
  const box = document.querySelector('.promptBox[data-node="' + nodeId + '"]');
  const ed = box && box.querySelector('.pEdit');
  if (!ed) return;
  const n = nodeById(nodeId);

  r.setStartBefore(chip);
  r.setEndAfter(chip);
  r.deleteContents();
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  n.prompt = editToText(ed);
  softSync();
}

/* ===================== 费用 ===================== */
/* 按「模型 × 分辨率」取每秒单价。Prime 优速版是标准版的 2 倍以上，
   只看分辨率会把费用少报一半多。模型认不出就退回标准版。 */
const VIDEO_COST_FALLBACK = 0.42;
function videoCost(n){
  const p = n.params;
  const tbl = S.cfg.videoCost[p.model] || S.cfg.videoCost['wan3.0-video'] || {};
  const per = tbl[p.resolution];
  return (per != null ? per : VIDEO_COST_FALLBACK) * p.duration;
}
/* 图片：输出按张 × 数量，参考图另按张收输入费（2.1 系列输入免费）。
   判定必须与后端 size_class() 一致，两边算得不一样就会少报。 */
const IMAGE_COST_FALLBACK = { out:{ '1K':0.25, '2K':0.50 }, in:0.02 };
function sizeClass(size){
  const s = String(size || '');
  return (s.indexOf('1536') >= 0 || s.indexOf('2048') >= 0) ? '2K' : '1K';
}
/* 图片块实际提交的尺寸：ratio × res 查预设表；auto 档不传尺寸，由模型按提示词推荐。
   预设表与后端 IMAGE_SIZE_PRESETS 一一对应，1K 档的值刻意不含 1536/2048，
   保证 sizeClass()（=后端 size_class()）归到 1K。 */
function imgSizeOf(p){
  if (!p || p.ratio === 'auto') return 'auto';
  const row = (S.cfg.imageSizePresets || {})[p.ratio];
  const v = row && row[p.res];
  return v || 'auto';
}
function imageCost(n){
  const p = n.imgParams;
  const row = S.cfg.imageCost[p.model] || S.cfg.imageCost['qwen-image-3.0-pro'] || IMAGE_COST_FALLBACK;
  const out = row.out || {};
  const cls = sizeClass(imgSizeOf(p));
  const per = out[cls] != null ? out[cls] : out['1K'];
  return (per != null ? per : 0.25) * p.n + (row.in || 0) * upstreamImages(n).length;
}
function costText(n){
  return n.type === 'video' ? '¥' + videoCost(n).toFixed(2) : '¥' + imageCost(n).toFixed(2);
}
function canGenerate(n){
  if (S.running) return false;
  const r = role(n);
  if (r === 'videoGen'){
    if (!mirrorText(n).on && !(n.prompt || '').trim()) return false;
    const rm = resolveVideo(n);
    if (rm.mode === 'fl' && (!edgeOf(n.id,'first') || !edgeOf(n.id,'last'))) return false;
    return true;
  }
  if (r === 'imageGen'){
    if (!mirrorText(n).on && !(n.imgPrompt || '').trim()) return false;
    const imgs = upstreamImages(n);
    if (imgs.length) return true;            // 图生图也允许只靠参考图
    return false;
  }
  return false;
}

function newNode(type, x, y){
  const n = {
    id:nid(), type, x:Math.round(x), y:Math.round(y), name:'',
    text:'', negText:DEFAULT_NEG, img:null, imgPrompt:'',
    imgParams:{ model:'qwen-image-3.0-pro', ratio:'auto', res:'1K', n:1, way:'auto', negativePrompt:DEFAULT_NEG, seed:'', promptExtend:true, watermark:false },    vid:null, aud:null, prompt:'',
    params:{ model:'wan3.0-video', mode:'fl', duration:5, resolution:'720P', ratio:'adaptive', audio:true },
    showFrames:false, barOff:{ dx:0, dy:0 },
    z:++S.zTop,                   // 新块默认压在最上层
    gen:{ status:null, taskId:null, resultUrl:null, error:'', images:[], effective:'' },
  };
  S.nodes.push(n);
  return n;
}

/**
 * 把某个块提到最上层。
 * 节点之间没有 z-index，叠放完全由 #world 里的 DOM 先后决定，
 * 所以「置顶」= 记下更高的 z + 把同一个元素 appendChild 到末尾。
 * 搬的是同一个元素实例，所以播放中的视频不会被重置。
 */
function bringToFront(id){
  const n = nodeById(id);
  if (!n) return;
  n.z = ++S.zTop;
  const el = $('#world').querySelector('.node[data-id="' + id + '"]');
  if (el && el.parentNode) el.parentNode.appendChild(el);
}
function addNode(type, x, y){
  if (type === 'upload') return pickFiles(x, y);
  const n = newNode(type, x != null ? x : 140 + Math.random()*120, y != null ? y : 110 + Math.random()*90);
  S.sel = n.id; S.selEdge = null;
  if (type === 'template'){ toast('模版块为预留类型，原站行为未确认，先占位不做生成', 'dim'); }
  else L('已添加「' + nodeName(n) + '」');
  render();
  return n;
}
function delNode(id){
  const n = nodeById(id);
  if (!n) return;
  S.edges = S.edges.filter(e => e.from !== id && e.to !== id);
  S.nodes = S.nodes.filter(x => x.id !== id);
  if (S.sel === id) S.sel = null;
  closeCtx();
  L('已删除「' + nodeName(n) + '」及其连线', 'dim');
  render();
}
function addEdge(from, to, toPort){
  const bad = canConnect(from, to, toPort);
  if (bad){ toast(bad, 'err'); return null; }
  const e = { id:'e' + (uid++), from, fromPort:'out', to, toPort };
  S.edges.push(e);
  const a = nodeById(from), b = nodeById(to);
  L('已连接：' + nodeName(a) + ' → ' + nodeName(b) + '（' + PORT_LABEL[toPort] + '）');
  return e;
}
function delEdge(id){
  const e = S.edges.find(x => x.id === id);
  if (!e) return;
  const a = nodeById(e.from), b = nodeById(e.to);
  L('已删除连线：' + (a ? nodeName(a) : '?') + ' → ' + (b ? nodeName(b) : '?'), 'dim');
  S.edges = S.edges.filter(x => x.id !== id);
  if (S.selEdge === id) S.selEdge = null;
  render();
}
function duplicateNode(id){
  const n = nodeById(id);
  if (!n) return null;
  const c = clone(n);
  c.id = nid(); c.x = n.x + 30; c.y = n.y + 30; c.name = n.name;
  c.gen = { status:null, taskId:null, resultUrl:null, error:'', images:[], effective:'' };
  c.barOff = { dx:0, dy:0 };
  c.z = ++S.zTop;                 // 副本压在最上层
  S.nodes.push(c);
  S.sel = c.id;
  L('已创建「' + nodeName(c) + '」的副本（独立连线）');
  render();
  return c;
}
function copyNode(id){
  const n = nodeById(id);
  if (!n) return;
  S.clipboard = clone(n);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(JSON.stringify(S.clipboard)).catch(() => {});
  } catch (e) {}
  L('已复制「' + nodeName(n) + '」到剪贴板，Ctrl+V 粘贴', 'dim');
}
async function pasteNode(){
  let data = S.clipboard;
  if (!data && navigator.clipboard && navigator.clipboard.readText){
    try {
      const t = await navigator.clipboard.readText();
      const j = JSON.parse(t);
      if (j && j.type) data = j;
    } catch (e) {}
  }
  if (!data || !data.type){ toast('剪贴板里没有可粘贴的块', 'err'); return; }
  const c = clone(data);
  c.id = nid();
  c.x = (nodeById(S.sel) ? nodeById(S.sel).x + 40 : 160) + 30;
  c.y = (nodeById(S.sel) ? nodeById(S.sel).y + 40 : 130) + 30;
  c.gen = { status:null, taskId:null, resultUrl:null, error:'', images:[], effective:'' };
  c.barOff = { dx:0, dy:0 };
  c.z = ++S.zTop;                 // 粘贴出来的新块压在最上层
  S.nodes.push(c);
  S.sel = c.id;
  L('已粘贴「' + nodeName(c) + '」');
  render();
}
function autoLayout(){
  const depth = {};
  const calc = id => {
    if (depth[id] !== undefined) return depth[id];
    depth[id] = 0;
    const ups = upsOf(id);
    depth[id] = ups.length ? Math.max(...ups.map(calc)) + 1 : 0;
    return depth[id];
  };
  S.nodes.forEach(n => calc(n.id));
  const cols = {};
  S.nodes.forEach(n => { const d = depth[n.id]; (cols[d] = cols[d] || []).push(n); });
  Object.keys(cols).forEach(d => cols[d].forEach((n, i) => { n.x = 70 + Number(d)*330; n.y = 60 + i*210; }));
  render();
  L('已自动排版', 'dim');
}

/* ===================== 文件处理 ===================== */
function kindOf(f){
  const t = (f.type || '').toLowerCase();
  const e = (f.name.split('.').pop() || '').toLowerCase();
  if (t.indexOf('image/') === 0 || ['jpg','jpeg','png','webp','bmp'].includes(e)) return 'image';
  if (t.indexOf('video/') === 0 || ['mp4','mov'].includes(e)) return 'video';
  if (t.indexOf('audio/') === 0 || ['wav','mp3'].includes(e)) return 'audio';
  return null;
}
function readDataURL(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error(f.name + ' 读取失败'));
    r.readAsDataURL(f);
  });
}
/**
 * 上传素材文件到本地，返回素材对象数组（不建块）。
 * URL 必须带上所属目录（/uploads/xxx.png）——静态白名单只放行三个素材目录，
 * 漏掉前缀会直接 403，图片就变成空白框。
 */
async function uploadRaw(files){
  const ok = [], bad = [];
  for (const f of files){
    const k = kindOf(f);
    if (!k){ bad.push(f.name + '（不支持的格式）'); continue; }
    if (f.size > LIMIT_MB[k] * 1048576){ bad.push(f.name + '（超过 ' + LIMIT_MB[k] + 'MB）'); continue; }
    ok.push({ file:f, kind:k });
  }
  if (bad.length) toast('已跳过 ' + bad.length + ' 个文件：' + bad.join('、'), 'err');
  if (!ok.length) return [];
  let dataUrls;
  try { dataUrls = await Promise.all(ok.map(o => readDataURL(o.file))); }
  catch (e){ toast(e.message, 'err'); return []; }

  const payload = { files: ok.map((o, i) => ({ name:o.file.name, kind:o.kind, dataUrl:dataUrls[i] })) };
  const r = await post('/api/upload', payload);
  if (!r.ok){ toast('上传失败：' + r.error, 'err'); return []; }
  return r.files.map(f => {
    const parts = String(f.local || '').replace(/\\/g, '/').split('/');
    const file = parts.pop() || '';
    const dir = parts[parts.length - 1] || 'uploads';   // 通常是 uploads
    return { name:f.name, kind:f.kind, size:f.size, url:'/' + dir + '/' + file, box:f.local };
  });
}
/** 上传并为每个文件生成一个素材源块 */
async function uploadFiles(files, at){
  const items = await uploadRaw(files);
  const out = [];
  items.forEach((it, i) => {
    const n = newNode(it.kind === 'image' ? 'image' : 'video', at.x + i*34, at.y + i*34);
    if (it.kind === 'image') n.img = it;
    else if (it.kind === 'video') n.vid = it;
    else n.aud = it;
    out.push(n);
  });
  if (out.length) L('已添加 ' + out.length + ' 个素材块', 'ok');
  return out;
}
function pickFiles(x, y){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.accept = 'image/jpeg,image/png,image/webp,image/bmp,video/mp4,video/quicktime,audio/wav,audio/mpeg';
  inp.onchange = async () => {
    if (!inp.files.length) return;
    const nodes = await uploadFiles(inp.files, { x:x != null ? x : 160, y:y != null ? y : 130 });
    if (nodes.length){ S.sel = nodes[nodes.length-1].id; render(); }
  };
  inp.click();
}
/** 把本地文件塞进已有块的素材位（视频上传 / 图片更换）。注意取的是素材对象，不是新建的块 */
async function fillSlot(n, kind){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = ACCEPT[kind];
  inp.onchange = async () => {
    if (!inp.files.length) return;
    const items = await uploadRaw(inp.files);
    const it = items[0];
    if (!it) return;
    const want = kind === 'image' ? '图片' : kind === 'video' ? '视频' : '音频';
    if (it.kind !== kind){ toast('这里只能放' + want + '，你选的是' + (it.kind === 'image' ? '图片' : it.kind === 'video' ? '视频' : '音频'), 'err'); return; }
    if (kind === 'image') n.img = it;
    else if (kind === 'video') n.vid = it;
    else n.aud = it;
    L('「' + nodeName(n) + '」已接收素材：' + it.name, 'ok');
    render();
  };
  inp.click();
}

      (n.gen.error ? '<div class="err1">' + esc(n.gen.error) + '</div>' : '') +
      (refs.length > maxRefs ? '<div class="err1">参考图 ' + refs.length + ' 张，' + p.model + ' 最多 ' + maxRefs + ' 张，请断开多余连线</div>' : '') +
      '<div class="optRow"><span class="cost">预计 <b data-cost>' + costText(n) + '</b> · ×' + p.n + '</span>' +
      (n.gen.status === 'run' ? '<span class="spin"></span>' : '') +
      '<button class="genBtn" data-act="gen" data-node="' + n.id + '"' + (canGenerate(n) ? '' : ' disabled') + ' title="生成图片">↑</button></div>';
  }

  // --- 视频生成 ---
  const rm = resolveVideo(n);
  const p = n.params;
  const om = rm.mode === 'omni' ? upstreamMedia(n) : [];
  const chips = om.length
    ? '<div class="chips">' + om.map((m, i) =>
        '<span class="chip ' + m.kind + '">@' + m.chip + (i+1) + '</span>').join('') + '</div>'
    : '';
  const frames = (p.mode === 'fl' || n.showFrames) ? framesHTML(n) : '';
  const ph = mt.on ? '' : (rm.mode === 'omni' ? '使用参考内容，例如：@图片1 @视频1 @音频1' : '描述你想要生成的视频内容');
  // 原站规则：一旦和任何节点连上（进或出都算），这个视频块就不再是起点，
  // 上传与图生视频两个入口就该收起来。规则与图片块一致，见 hasAnyEdge。
  const isSink = hasAnyEdge(n.id);
  // 多参考模式下原站在输入框左上角先摆「输入」标签和 @ 徽章（见原站截图 2026-10-16 220957）。
  // 文本镜像态下输入框是只读的、不该显示这个，所以只在可编辑且为 omni 时出。
  const pre = (!mt.on && rm.mode === 'omni')
    ? '<span class="promptPre">输入<i class="at">@</i></span>' : '';
  // omni 用 contenteditable：只有它能在文字中间插真正的引用芯片（截图 2026-10-16 224342）。
  // 其余情况仍是普通 textarea，交互与状态完全不变。
  const editable = (!mt.on && rm.mode === 'omni');

  const boxOpen = '<div class="promptBox' + (pre ? ' hasPre' : '') + '" data-node="' + n.id + '">' + pre;
  const field = editable
    ? '<div class="pEdit" contenteditable="true" spellcheck="false" data-edit="' + n.id + '" data-ph="' +
      esc(ph) + '"></div>'
    : '<textarea class="prompt' + (mt.on ? ' mirror' : '') + '" data-bind="prompt"' +
      (mt.on ? ' readonly' : '') + ' placeholder="' + ph + '">' + esc(mt.on ? mt.text : n.prompt) + '</textarea>';

  return boxOpen + field +
    (editable ? '<div class="atPop" data-atpop="' + n.id + '"></div>' : '') + '</div>' +
    chips + frames +
    (!mt.on && !isSink ? '<div class="opts">' +
      '<button class="opt" data-act="upVid">↑ 视频上传</button>' +
      '<button class="opt" data-act="i2v">↻ 图生视频</button>' +
      '</div>' : '') +
    (rm.note ? '<div class="hint1" style="color:var(--warn)">' + esc(rm.note) + '</div>' : '') +
    (n.gen.effective ? '<div class="hint1">已按 <b>' + n.gen.effective + '</b> 模式提交</div>' : '') +
    (n.gen.error ? '<div class="err1">' + esc(n.gen.error) + '</div>' : '') +
    (n.gen.resultUrl ? playerHTML(n) : '') +
    '<div class="optRow"><span class="cost">预计 <b data-cost>' + costText(n) + '</b></span>' +
      '<span class="cost">x1</span>' +
      (n.gen.status === 'run' ? '<span class="spin"></span>' : '') +
      '<button class="genBtn" data-act="gen" data-node="' + n.id + '"' + (canGenerate(n) ? '' : ' disabled') + ' title="生成视频">↑</button></div>';
}

function imgWay(n){
  const refs = upstreamImages(n).length;
  if (n.imgParams.way !== 'auto') return n.imgParams.way;   // 用户显式选了就照办
  if (!refs) return 't2i';                                 // 没上游 -> 文生图
  if (refs === 1) return 'i2i';                            // 一张 -> 图生图
  return 'ref';                                            // 多张 -> 参考图生图
}

function nodeHTML(n){
  const p = PALETTE.find(x => x.type === n.type) || { ico:'?', color:'#555' };
  const r = role(n);
  const g = n.gen;
  const badge = g.status === 'run' ? '<span class="tag run">生成中</span>'
              : g.status === 'done' ? '<span class="tag ok">完成</span>'
              : g.status === 'err' ? '<span class="tag err">失败</span>' : '';
  const rl = ROLE_LABEL[r] || '';
  const cls = r === 'template' ? '' : (String(r).indexOf('Src') >= 0 || r === 'text' ? ' src' : ' gen');
  return '<div class="nHead" data-drag="1" data-node="' + n.id + '">' +
      '<div class="ico" style="color:' + p.color + '">' + p.ico + '</div>' +
      (S.renaming === n.id
        ? '<input class="nRename" data-rename="' + n.id + '" value="' + esc(n.name) + '" placeholder="' + esc(nodeName(n)) + '">'
        : '<b class="nName" data-node="' + n.id + '" title="双击重命名">' + esc(nodeName(n)) + '</b>') +
      '<span class="nRole' + cls + '">' + rl + '</span>' + badge +
    '</div>' +
    '<div class="nBody">' + bodyHTML(n) + '</div>';
}

/* ===================== 渲染：连线 ===================== */

/**
 * 决定这个块的进出端口停在哪条水平线上（距块顶多少像素），并写回 DOM。
 *
 * 默认是块的垂直中线（CSS 里 top:50%）。但首尾帧生成时，首帧/尾帧的连接点也画在块左侧，
 * 与上下居中的 .port 几乎叠在一起 —— 实测只差 4.4px，三个紫点糊成一坨。
 * 所以帧位行可见时把端口抬到提示框的垂直中心：提示框永远排在帧位行上面，
 * 于是三个点自然拉开。入端口和出端口一起挪，保持左右对齐，进出线不会一高一低。
 *
 * 必须用真实尺寸算，不能写死百分比：块高会随提示词、帧位行、提示文案变化。
 */
/**
 * 把首帧/尾帧的连接点摆到块的左边框上，与进出端口同一条竖轴，并记下连线锚点。
 *
 * 原来圆点是 .fslot 里的流内元素，靠 margin-left:-15px 顶出去，结果落在块内侧 11px，
 * 和端口错开一截（实测 portIn.x=0.0 而 fdot.x=11.0）。现在改成绝对定位直接挂在 .node 上，
 * left 复用端口那一套 -7px，垂直位置按所在帧位行的中心实时算，行高怎么变都不会错位。
 *
 * 锚点 n._fp 也在这里一并算：直接读圆点自己的 rect，不再用 offsetTop 加经验常数。
 * 旧算法那句「+14」让连线终点比圆心低 12px、偏左 17px，是长期的观感毛刺，
 * 这里换掉后自动消失。
 */
function placeFrameDots(n, el){
  n._fp = {};
  const er = el.getBoundingClientRect();
  el.querySelectorAll('.fdot').forEach(d => {
    const host = d.closest('.fslot');
    if (!host) return;
    const hr = host.getBoundingClientRect();
    d.style.top = (hr.top + hr.height / 2 - er.top) + 'px';
    const dr = d.getBoundingClientRect();
    n._fp[d.dataset.port] = { x:dr.left + dr.width/2 - er.left, y:dr.top + dr.height/2 - er.top };
  });
}

function placePorts(n, el){
  const h = n._h || 120;
  n._po = h / 2;
  const dots = el.querySelectorAll('.fdot');
  if (dots.length){
    const er = el.getBoundingClientRect();
    let topMost = Infinity;
    dots.forEach(d => { topMost = Math.min(topMost, d.getBoundingClientRect().top - er.top); });
    const pr = el.querySelector('.prompt');
    let want = pr
      ? pr.getBoundingClientRect().top - er.top + pr.getBoundingClientRect().height / 2
      : 30;
    if (topMost - want < 20) want = topMost - 20;   // 提示框太矮就贴到帧位行上方，绝不退回中线（那里正好撞车）
    n._po = Math.max(24, Math.min(want, h - 12));  // 别钻进标题栏，也别掉到块外面
  }
  // CSS 是 top:50% + translateY(-50%)，覆盖 top 即可，transform 让圆点仍以该线为中心
  el.querySelectorAll('.port').forEach(p => { p.style.top = n._po + 'px'; });
}

function anchor(n, side, port){
  const h = n._h || 120;
  const py = (n._po == null ? h / 2 : n._po);   // 端口不总在垂直中线，见 placePorts
  if (side === 'out') return { x:n.x + NW, y:n.y + py };
  if (port === 'first' || port === 'last'){
    const fp = n._fp && n._fp[port];
    if (fp) return { x:n.x + fp.x, y:n.y + fp.y };
  }
  return { x:n.x, y:n.y + py };
}
function pathD(x1, y1, x2, y2){
  const dx = Math.max(40, Math.abs(x2-x1) * 0.5);
  return 'M' + x1 + ',' + y1 + ' C' + (x1+dx) + ',' + y1 + ' ' + (x2-dx) + ',' + y2 + ' ' + x2 + ',' + y2;
}

/**
 * 把还活着的 <video>/<audio> 元素摘出来暂存，重建后再原样放回去。
 * 否则每次 render() 都会销毁重建媒体元素，播放器被重置回 0:00 重新加载 ——
 * 表现为「点别处就转圈」「拖动块时卡顿」。这里必须搬同一个元素实例，不能只搬状态。
 */
function stashMedia(root){
  const out = [];
  root.querySelectorAll('.node').forEach(elm => {
    const id = elm.dataset.id;
    elm.querySelectorAll('video, audio').forEach(m => {
      const src = m.getAttribute('src') || '';
      out.push({ id, src, el:m, t:m.currentTime, paused:m.paused, vol:m.volume, rate:m.playbackRate });
      m.remove();                      // 摘出文档，避开随节点一起被销毁
    });
  });
  return out;
}
function restoreMedia(list, root){
  list.forEach(s => {
    const host = root.querySelector('.node[data-id="' + s.id + '"]');
    if (!host) return;
    const cand = Array.prototype.filter.call(host.querySelectorAll('video, audio'), m => (m.getAttribute('src') || '') === s.src);
    const fresh = cand[0];
    if (!fresh) return;                 // 位置没了（比如切成生成块了），就让新的正常加载
    // 注意 replaceChild 的 oldChild 必须是「直接」子节点，媒体元素嵌在 .mediaWrap 里，要用它的父节点
    fresh.parentNode.replaceChild(s.el, fresh);
    const m = s.el;
    try{
      m.volume = s.vol;
      m.playbackRate = s.rate;
      if (Math.abs(m.currentTime - s.t) > 0.15) m.currentTime = s.t;
      if (s.paused) m.pause(); else m.play().catch(() => {});
    } catch (e){}
  });
}

// 渲染防重入：移除节点会让正在聚焦的输入框同步触发 blur，
// 重命名输入框的 blur 处理里会调 render()，于是 render 套 render，
// 内层把刚摘掉的节点又摘一次，直接抛 "node to be removed is no longer a child"。
// 外层这一遍本来就会用最新状态重建节点，内层那次直接丢弃即可。
let _rendering = false;
function render(){
  if (_rendering) return;
  _rendering = true;
  try { renderInner(); } finally { _rendering = false; }
}
function renderInner(){
  const W = $('#world');
  const media = stashMedia(W);
  W.querySelectorAll('.node').forEach(e => e.remove());

  S.nodes.slice().sort((a, b) => (a.z || 0) - (b.z || 0)).forEach(n => {
    const el = document.createElement('div');
    el.className = 'node' + (S.sel === n.id ? ' sel' : '') + (n.gen.status ? ' st-' + n.gen.status : '');
    el.style.transform = 'translate(' + n.x + 'px,' + n.y + 'px)';
    el.dataset.id = n.id;
    el.innerHTML = portsHTML(n) + nodeHTML(n);
    W.appendChild(el);
  });

  // 量高度 + 帧位连接点坐标，再画线（连线依赖真实尺寸）
  S.nodes.forEach(n => {
    const el = W.querySelector('.node[data-id="' + n.id + '"]');
    if (!el) return;
    // 多参考的编辑器是空的，芯片得从纯文本灌回去（内容会影响块高，必须在测量之前）
    const ed = el.querySelector('.pEdit');
    if (ed) textToEdit(ed, n.prompt || '', refList(n));
    n._h = el.offsetHeight || 120;
    placeFrameDots(n, el);
    placePorts(n, el);
  });

  restoreMedia(media, W);
  renderEdges();
  applyView();          // 每次重绘都要重新应用视图变换，否则节点与工具条坐标系不一致
  renderHud();
  renderTop();
  renderHist();
  softSync();
}

function renderEdges(){
  const parts = [];
  S.edges.forEach(e => {
    const a = nodeById(e.from), b = nodeById(e.to);
    if (!a || !b) return;
    const p1 = anchor(a, 'out'), p2 = anchor(b, 'in', e.toPort);
    const d = pathD(p1.x, p1.y, p2.x, p2.y);
    const on = S.selEdge === e.id;
    const near = S.sel === e.from || S.sel === e.to;
    const col = e.toPort === 'first' || e.toPort === 'last' ? '#e8933a' : (on ? '#ff6b6b' : near ? '#8b7fff' : '#4a4a52');
    parts.push('<path class="edgeHit" d="' + d + '" data-edge="' + e.id + '"/>');
    parts.push('<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (on ? 3 : 2) + '" marker-end="url(#ah)" style="pointer-events:none"/>');
  });
  if (S.drag && S.drag.type === 'connect')
    parts.push('<path d="' + pathD(S.drag.x1, S.drag.y1, S.drag.x2, S.drag.y2) + '" fill="none" stroke="#8b7fff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)" style="pointer-events:none"/>');
  $('#edges').innerHTML = parts.join('');

  const old = $('#world').querySelector('.edgeDel');
  if (old) old.remove();
  const se = S.edges.find(x => x.id === S.selEdge);
  if (se){
    const a = nodeById(se.from), b = nodeById(se.to);
    if (a && b){
      const p1 = anchor(a, 'out'), p2 = anchor(b, 'in', se.toPort);
      const btn = document.createElement('div');
      btn.className = 'edgeDel'; btn.textContent = '×'; btn.title = '删除这条连线（也可按 Delete 键）';
      btn.style.left = ((p1.x + p2.x)/2) + 'px';
      btn.style.top = ((p1.y + p2.y)/2) + 'px';
      btn.onclick = ev => { ev.stopPropagation(); delEdge(se.id); };
      $('#world').appendChild(btn);
    }
  }
}

/** 不重建 DOM 的同步：镜像值 / 费用 / 按钮可用态 —— 打字时只走这条路径，textarea 焦点不丢 */
function softSync(){
  S.nodes.forEach(n => {
    const el = $('#world').querySelector('.node[data-id="' + n.id + '"]');
    if (!el) return;
    const r = role(n);
    if (r === 'videoGen' || r === 'imageGen'){
      // 多参考模式的 contenteditable：只有它不是当前焦点时才回填，
      // 否则打字打到一半被重写，光标直接跳走
      const ed = el.querySelector('.pEdit');
      if (ed){
        if (document.activeElement !== ed && editToText(ed) !== (n.prompt || '')){
          textToEdit(ed, n.prompt || '', refList(n));
        }
      } else {
        const mt = mirrorText(n);
        const ta = el.querySelector('textarea.prompt:not(.neg)');
        if (ta){
          ta.readOnly = mt.on;
          ta.classList.toggle('mirror', mt.on);
          ta.value = mt.on ? mt.text : (r === 'imageGen' ? n.imgPrompt : n.prompt);
          if (!mt.on){
            const rm = resolveVideo(n);
            ta.placeholder = r === 'imageGen'
              ? (upstreamImages(n).length ? '描述要如何改造这张参考图…' : '描述你想要的画面…')
              : (rm.mode === 'omni' ? '使用参考内容，例如：@图片1 @视频1 @音频1' : '描述你想要生成的视频内容');
          }
        }
        // 负向提示词那一截：被镜像时跟提示词一样变只读
        const nt = el.querySelector('textarea.prompt.neg');
        if (nt){
          nt.readOnly = mt.on;
          nt.classList.toggle('mirror', mt.on);
          if (nt.dataset.bind === 'negPrompt') nt.value = mt.on ? mt.neg : (n.imgParams.negativePrompt || '');
        }
      }
      const c = el.querySelector('[data-cost]');
      if (c) c.textContent = costText(n);
      const g = el.querySelector('.genBtn');
      if (g) g.disabled = !canGenerate(n);
      const pl = el.querySelector('[data-vol]');
      if (pl) pl.volume = volume()/100;
    }
  });
}

/* ===================== HUD：悬浮工具条 ===================== */
/**
 * HUD 是 .canvasWrap 内的绝对定位层，用的是「画布局部坐标」。
 * 注意：这里不要再叠加 getBoundingClientRect() 的视口偏移，否则坐标被重复累加，
 * 工具条会盖在块身上。
 */
function wrapBox(){
  const r = $('#canvasWrap').getBoundingClientRect();
  return { w:r.width, h:r.height };
}
function toScreen(n){
  const v = S.view;
  return { x:v.x + n.x * v.k, y:v.y + n.y * v.k };
}
function closePop(){ S.pop = null; renderHud(); }

function renderHud(){
  const hud = $('#hud');
  hud.innerHTML = '';

  /**
   * 原站行为：选中的块，它的胶囊**钉在页面上**，指针移开也不消失；
   * 指针悬停到别的块时，那个块的胶囊会额外冒出来。两者可以同时存在。
   * 只有点画布空白取消选中，钉住的那条才会消失。
   * 所以不能写成 `S.hover || S.sel` —— 那样悬停会把选中块的胶囊顶掉。
   */
  const targets = [];
  const sn = nodeById(S.sel);
  if (sn) targets.push(sn);
  const hn = nodeById(S.hover);
  if (hn && hn.id !== S.sel) targets.push(hn);

  const bars = {};
  targets.forEach(n => {
    const ctrls = toolbarControls(n);
    if (!ctrls.length) return;                 // 文本块 / 模版块没有工具条
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.innerHTML = '<div class="grip" title="拖动工具条"></div>' + ctrls;
    hud.appendChild(bar);
    // 工具条锚在块上方；顶到画布上沿就翻到块下方
    const off = n.barOff || { dx:0, dy:0 };
    const box = wrapBox();
    const nw = (n._h || 120) * S.view.k;
    let left = toScreen(n).x + off.dx;
    let top = toScreen(n).y + off.dy - 44;
    if (top < 6) top = toScreen(n).y + nw + 10 + off.dy;
    const bw = bar.offsetWidth;
    if (left + bw > box.w - 6) left = Math.max(6, box.w - bw - 6);
    if (left < 6) left = 6;
    bar.style.left = left + 'px';
    bar.style.top = top + 'px';
    bar.querySelectorAll('[data-ctl]').forEach(el => {
      el.onmousedown = ev => ev.stopPropagation();
      el.onclick = ev => {
        ev.stopPropagation();
        const c = el.dataset.ctl;
        if (el.classList.contains('dis')){ toast('还没有成片，无法下载', 'err'); return; }
        if (c === 'swap'){ fillSlot(n, el.dataset.kind); return; }
        if (c === 'audio'){ n.params.audio = !n.params.audio; softSync(); renderHud(); return; }
        if (c === 'pextend'){ n.imgParams.promptExtend = !n.imgParams.promptExtend; renderHud(); return; }
        if (c === 'download'){ downloadNode(n); return; }
        if (S.pop && S.pop.ctl === c && S.pop.node === n.id){ closePop(); return; }
        S.pop = { node:n.id, ctl:c };
        renderHud();
      };
    });
    // 工具条可拖动
    const grip = bar.querySelector('.grip');
    grip.onmousedown = ev => {
      ev.stopPropagation();
      S.drag = { type:'bar', id:n.id, sx:ev.clientX, sy:ev.clientY };
      ev.preventDefault();
    };
    bars[n.id] = bar;
  });

  // 弹出层
  if (S.pop && S.pop.node){
    const pn = nodeById(S.pop.node);
    if (!pn || !isGen(pn)){ S.pop = null; return; }
    const bar = bars[S.pop.node] || null;
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.innerHTML = popHTML(pn, S.pop.ctl);
    const box = wrapBox();
    let left = parseFloat(bar ? bar.style.left : 0) || toScreen(pn).x;
    let top = (bar ? parseFloat(bar.style.top) + 40 : toScreen(pn).y);
    hud.appendChild(pop);
    const w = pop.offsetWidth, h = pop.offsetHeight;
    if (left + w > box.w - 8) left = Math.max(8, box.w - w - 8);
    if (top + h > box.h - 8) top = Math.max(8, box.h - h - 8);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    pop.onmousedown = ev => ev.stopPropagation();
    pop.querySelectorAll('[data-pick]').forEach(el => el.onclick = ev => {
      ev.stopPropagation();
      applyPick(pn, S.pop.ctl, el.dataset.pick);
      closePop();
      render();
    });
    const sl = pop.querySelector('[data-slider]');
    if (sl){
      const out = pop.querySelector('[data-sval]');
      sl.oninput = () => { out.textContent = sl.value; pn.params.duration = Number(sl.value); softSync(); };
      sl.onchange = () => { L('时长设为 ' + sl.value + 's'); };
      sl.onmousedown = ev => ev.stopPropagation();
    }
  }
}

function applyPick(n, ctl, val){
  if (ctl === 'model') n.params.model = val;
  else if (ctl === 'imodel') n.imgParams.model = val;
  else if (ctl === 'mode'){
    n.params.mode = val;
    if (val === 'fl') n.showFrames = true;
    if (val === 'omni') n.showFrames = false;
  }
  else if (ctl === 'duration') n.params.duration = Number(val);
  else if (ctl === 'res') n.params.resolution = val;
  else if (ctl === 'ratio') n.params.ratio = val;
  else if (ctl === 'iratio') n.imgParams.ratio = val;
  else if (ctl === 'ires') n.imgParams.res = val;
  else if (ctl === 'count') n.imgParams.n = Number(val);
}
function downloadNode(n){
  // 素材源块：下载它带的那个文件
  const m = n.img || n.vid || n.aud;
  if (m && !isGen(n)){
    const a = document.createElement('a');
    a.href = m.url;
    a.download = m.name || 'media';
    a.click();
    return;
  }
  if (n.type === 'video'){
    if (!n.gen.resultUrl){ toast('还没有成片', 'err'); return; }
    const a = document.createElement('a');
    a.href = n.gen.resultUrl;
    a.download = (n.name || 'wan3') + '.mp4';
    a.click();
  } else {
    if (!n.gen.images.length){ toast('还没有生成图片', 'err'); return; }
    n.gen.images.forEach((u, i) => {
      const a = document.createElement('a');
      a.href = u; a.download = (n.name || 'qwen-image') + '-' + (i+1) + '.png';
      a.click();
    });
  }
}

/* ===================== 右键菜单 ===================== */
function openCtx(id, cx, cy){
  const n = nodeById(id);
  if (!n) return;
  S.ctx = { id };
  const m = $('#ctx');
  m.innerHTML =
    '<button class="ctxItem" data-cmd="copy">复制<span class="ck">Ctrl+C</span></button>' +
    '<button class="ctxItem" data-cmd="dup">创建副本</button>' +
    '<button class="ctxItem" data-cmd="rename">重命名<span class="ck">R</span></button>' +
    '<div class="ctxSep"></div>' +
    '<button class="ctxItem danger" data-cmd="del">删除<span class="ck">Delete</span></button>';
  m.classList.add('show');
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(cx, window.innerWidth - w - 8) + 'px';
  m.style.top = Math.min(cy, window.innerHeight - h - 8) + 'px';
  m.querySelectorAll('[data-cmd]').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const cmd = el.dataset.cmd;
    closeCtx();
    if (cmd === 'copy') copyNode(id);
    else if (cmd === 'dup') duplicateNode(id);
    else if (cmd === 'del') delNode(id);
    else if (cmd === 'rename') startRename(id);
  });
}
function closeCtx(){
  S.ctx = null;
  const m = $('#ctx');
  if (m) m.classList.remove('show');
}
function startRename(id){
  S.renaming = id;
  render();
  const el = $('#world').querySelector('[data-rename="' + id + '"]');
  if (!el) return;
  el.focus(); el.select();
  const done = commit => {
    if (el.__done) return;        // blur 与 keydown 可能都来，只认第一次
    el.__done = true;
    if (commit && S.renaming === id) nodeById(id).name = el.value.trim();
    S.renaming = null;
    render();
  };
  el.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter'){ done(true); }
    else if (e.key === 'Escape'){ done(false); }
  };
  el.onblur = () => done(true);
}

/* ===================== 画布交互 ===================== */
function toWorld(cx, cy){
  const r = $('#canvasWrap').getBoundingClientRect();
  return { x:(cx - r.left - S.view.x) / S.view.k, y:(cy - r.top - S.view.y) / S.view.k };
}
/** 软选中：只换高亮和工具条，绝不重建 DOM */
function softSelect(nodeEl){
  if (!nodeEl || S.sel === nodeEl.dataset.id) return;
  S.sel = nodeEl.dataset.id;
  S.selEdge = null;
  document.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
  nodeEl.classList.add('sel');
  renderHud();
}
function initCanvas(){
  const wrap = $('#canvasWrap');

  wrap.addEventListener('mousedown', e => {
    if (e.button === 2) return;
    if (e.target.closest('[data-ctl]') || e.target.closest('.pop') || e.target.closest('.bar')) return;
    // .fdot 是帧位连接点，它只带 data-port 不带 .port 类，漏掉会导致帧位根本拖不动
    const portEl = e.target.closest('.port, .fdot');
    const nodeEl = e.target.closest('.node');
    const edgeEl = e.target.closest('[data-edge]');
    const delEl = e.target.closest('.edgeDel');

    // 中点那个红色叉号是浮在 #world 上的 div，既不在 .node 里、也不带 data-edge。
    // 不在这里拦一手的话，它会掉进最下面的 else：取消选中 -> renderEdges() -> renderEdges() 第 909 行
    // 把这个叉号自己给删了。元素一脱离文档，浏览器就不会再在它身上派发 click，
    // onclick 里的 delEdge 根本不会执行 —— 表现就是「叉号按了没反应，只有 Delete 键好使」。
    if (delEl){ e.preventDefault(); e.stopPropagation(); return; }

    if (edgeEl){ S.selEdge = edgeEl.dataset.edge; S.sel = null; render(); e.preventDefault(); return; }

    if (portEl){
      const nodeId = portEl.dataset.node;
      const port = portEl.dataset.port;
      if (port === 'out'){
        const n = nodeById(nodeId);
        const p = anchor(n, 'out');
        S.drag = { type:'connect', from:nodeId, toPort:null, x1:p.x, y1:p.y, x2:p.x, y2:p.y };
      } else {
        // 从入端口/帧位连接点往回连
        const n = nodeById(nodeId);
        const p = anchor(n, 'in', port);
        S.drag = { type:'connect', to:nodeId, toPort:port, x1:p.x, y1:p.y, x2:p.x, y2:p.y };
      }
      S.selEdge = null;
      S.sel = null;
      document.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
      renderHud();
      renderEdges();      // 只重画线，不重建节点：否则连接点会在光标下位移，落点判错
      e.preventDefault();
      return;
    } else if (nodeEl && e.target.closest('[data-drag]')){
      const n = nodeById(nodeEl.dataset.id);
      // 双击块名 = 重命名。
      // 这里手工判双击而不是听浏览器的 dblclick 事件：mousedown 分支会 bringToFront()
      // 把节点 appendChild 到 #world 末尾，元素一旦被移动，浏览器认为两次点击的目标不是
      // 同一个，原生 dblclick 压根不派发 —— 表现就是「双击没反应」。手工判定不受此影响。
      const nameEl = e.target.closest('.nName');
      if (nameEl){
        const now = performance.now(), d = S.dbl;
        if (d && d.id === n.id && now - d.t < 450 &&
            Math.abs(e.clientX - d.x) < 8 && Math.abs(e.clientY - d.y) < 8){
          S.dbl = null;
          e.preventDefault();
          startRename(n.id);
          return;
        }
        S.dbl = { id:n.id, t:now, x:e.clientX, y:e.clientY };
        S.selEdge = null;
        if (S.sel !== n.id){
          S.sel = n.id;
          document.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
          nodeEl.classList.add('sel');
          renderHud();
        }
        e.preventDefault();
        return;                 // 名称上不启动拖动，标题栏别处照样能拖块
      }
      const w = toWorld(e.clientX, e.clientY);
      S.selEdge = null;
      bringToFront(n.id);         // 一按下去就置顶：拖动中的块不能被别的块盖住
      S.drag = { type:'node', id:n.id, ox:w.x - n.x, oy:w.y - n.y };
      if (S.sel !== n.id){
        S.sel = n.id;
        document.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
        nodeEl.classList.add('sel');
        renderHud();
      }
      e.preventDefault();
      return;                 // 不 render：重建会打断正在播放的视频
    } else if (nodeEl){
      // 块体内部的任何东西（按钮、输入框、图片、播放器、音量条…）：
      // 只能软选中，绝不能 render()。否则节点被重建，元素当场脱离 DOM，
      // 随后的 click 冒泡不到委托监听器 —— 表现就是「点了没反应」。
      softSelect(nodeEl);
      return;
    } else {
      S.dbl = null;              // 点到空白就作废刚才那一次，否则久之后再点名称会误判成双击
      S.drag = { type:'pan', sx:e.clientX, sy:e.clientY, vx:S.view.x, vy:S.view.y };
      if (S.sel || S.selEdge || S.hover){
        S.sel = null; S.selEdge = null; S.hover = null;
        document.querySelectorAll('.node.sel').forEach(x => x.classList.remove('sel'));
        renderHud();
        renderEdges();        // 同理：点空白取消选中也不该重建
      }
    }
    render();
    e.preventDefault();
  });

  wrap.addEventListener('mousemove', e => {
    const d = S.drag;
    if (d){
      if (d.type === 'pan'){
        S.view.x = d.vx + (e.clientX - d.sx);
        S.view.y = d.vy + (e.clientY - d.sy);
        $('#world').style.transform = 'translate(' + S.view.x + 'px,' + S.view.y + 'px) scale(' + S.view.k + ')';
        $('#zinfo').textContent = Math.round(S.view.k*100) + '%';
      } else if (d.type === 'bar'){
        const n = nodeById(d.id);
        if (n){
          n.barOff = { dx:n.barOff.dx + (e.clientX - d.sx), dy:n.barOff.dy + (e.clientY - d.sy) };
          d.sx = e.clientX; d.sy = e.clientY;
          renderHud();
        }
      } else if (d.type === 'node'){
        const n = nodeById(d.id), w = toWorld(e.clientX, e.clientY);
        if (n){
          n.x = Math.round(w.x - d.ox);
          n.y = Math.round(w.y - d.oy);
          // 只挪元素 + 重画连线，绝不 render()。整块重建会让 <video> 重新加载，拖一次卡一次。
          const el = $('#world').querySelector('.node[data-id="' + n.id + '"]');
          if (el) el.style.transform = 'translate(' + n.x + 'px,' + n.y + 'px)';
          renderEdges();
        }
      } else if (d.type === 'connect'){
        const w = toWorld(e.clientX, e.clientY);
        d.x2 = w.x; d.y2 = w.y;
        // 高亮可落点
        const tEl = document.elementFromPoint(e.clientX, e.clientY);
        const tNode = tEl && tEl.closest ? tEl.closest('.node') : null;
        S.drag.over = tNode && tNode.dataset.id !== d.from ? tNode.dataset.id : null;
        renderEdges();
      }
      return;
    }
    // 悬停高亮生成块
    const tEl = e.target.closest && e.target.closest('.node');
    const h = tEl ? tEl.dataset.id : null;
    if (h !== S.hover){ S.hover = h; renderHud(); }
  });

  wrap.addEventListener('mouseup', e => {
    const d = S.drag; S.drag = null;
    if (!d) return;
    if (d.type === 'bar' || d.type === 'node' || d.type === 'pan'){
      // 拖动过程中已经就地更新过，松手不需要重建
      renderHud();
      renderEdges();
      return;
    }
    if (d.type === 'connect'){
      const tEl = document.elementFromPoint(e.clientX, e.clientY);
      const tNode = tEl && tEl.closest ? tEl.closest('.node') : null;
      if (tNode){
        const tid = tNode.dataset.id;
        const portEl = tEl.closest('.port, .fdot');   // 帧位连接点也要能作为落点
        if (d.from){
          const port = portEl && portEl.dataset.node === tid && portEl.dataset.port !== 'out' ? portEl.dataset.port : 'in';
          addEdge(d.from, tid, port);
        } else if (d.to){
          addEdge(tid, d.to, d.toPort);
        }
      }
    }
    render();
  });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.min(2, Math.max(0.25, S.view.k * (e.deltaY < 0 ? 1.12 : 1/1.12)));
    S.view.x = mx - (mx - S.view.x) * (k2 / S.view.k);
    S.view.y = my - (my - S.view.y) * (k2 / S.view.k);
    S.view.k = k2;
    applyView();
  }, { passive:false });

  // 桌面文件拖入
  wrap.addEventListener('dragover', e => {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') < 0) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    if (!S.dropOver){ S.dropOver = true; $('#dropHint').classList.add('show'); }
  });
  wrap.addEventListener('dragleave', e => {
    if (e.target === wrap || !wrap.contains(e.relatedTarget)){ S.dropOver = false; $('#dropHint').classList.remove('show'); }
  });
  wrap.addEventListener('drop', async e => {
    e.preventDefault();
    S.dropOver = false; $('#dropHint').classList.remove('show');
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    const w = toWorld(e.clientX, e.clientY);
    const nodes = await uploadFiles(files, { x:Math.round(w.x - NW/2), y:Math.round(w.y - 60) });
    if (nodes.length){ S.sel = nodes[nodes.length-1].id; render(); }
  });

  // 右键
  wrap.addEventListener('contextmenu', e => {
    const nodeEl = e.target.closest('.node');
    const edgeEl = e.target.closest('[data-edge]');
    if (edgeEl){
      e.preventDefault();
      closeCtx();
      S.selEdge = edgeEl.dataset.edge; S.sel = null;
      render();
      return;
    }
    if (!nodeEl) return;
    e.preventDefault();
    S.sel = nodeEl.dataset.id; S.selEdge = null;
    render();
    openCtx(S.sel, e.clientX, e.clientY);
  });

  // 块内控件（事件委托）
  wrap.addEventListener('click', e => {
    const g = e.target.closest('[data-gen]');
    if (g){ runNode(g.dataset.node); return; }
    const w = e.target.closest('[data-way]');
    if (w){
      const n = nodeById(e.target.closest('.node').dataset.id);
      const v = w.dataset.way;
      n.imgParams.way = v;
      L('「' + nodeName(n) + '」生图方式：' + ({ t2i:'文生图', i2i:'图生图', ref:'参考图生图', stylize:'风格化转绘' })[v]);
      render();
      return;
    }
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const n = nodeById(e.target.closest('.node').dataset.id);
    const act = a.dataset.act;
    if (act === 'upVid') fillSlot(n, 'video');
    else if (act === 'upImg') fillSlot(n, 'image');
    else if (act === 'i2v') enableImageToVideo(n);
    else if (act === 'previewVid'){ window.open(a.getAttribute('src'), '_blank'); }
    else if (act === 'lightbox'){ openLightbox(a.dataset.url, n && (n.img ? n.img.name : '')); }
    else if (act === 'imgSrc'){ openLightbox(a.dataset.url, n && n.name ? n.name : ''); }
    else if (act === 'vol'){
      localStorage.setItem('wan3.volume', a.value);
      const t = a.parentElement.querySelector('[data-volTxt]');
      if (t) t.textContent = a.value + '%';
      const v = a.closest('.player').querySelector('video');
      if (v) v.volume = a.value/100;
    }
  });

  // 输入框：只更新模型 + 轻量同步，不重建 DOM
  wrap.addEventListener('input', e => {
    const t = e.target;
    // 多参考模式的 contenteditable：芯片折成 @图片1 存进模型，@ 触发选择列表
    if (t.classList && t.classList.contains('pEdit')){
      const n = nodeById(t.dataset.edit);
      if (!n) return;
      if (e.isComposing) return;                     // 中文输入法组字中，别去动 DOM
      n.prompt = editToText(t);
      const trg = atTrigger(t);
      if (trg && refList(n).length){
        S.at = { node:n.id, start:trg.start };
        openAt(n.id, refList(n), trg.query);
      } else if (S.atNode === n.id){
        closeAt(); S.at = null;
      }
      softSync();
      return;
    }
    const nodeEl = t.closest('.node');
    if (!nodeEl) return;
    const n = nodeById(nodeEl.dataset.id);
    const b = t.dataset.bind;
    if (!n || !b) return;
    if (mirrorText(n).on) return;                 // 被镜像时不允许直接改
    if (b === 'text'){ n.text = t.value; softSync(); }
    else if (b === 'prompt'){ n.prompt = t.value; softSync(); }
    else if (b === 'imgPrompt'){ n.imgPrompt = t.value; softSync(); }
    else if (b === 'negPrompt'){ n.imgParams.negativePrompt = t.value; softSync(); }
    else if (b === 'negText'){ n.negText = t.value; softSync(); }
  });

  // 多参考：点列表项插芯片、点芯片删芯片、点别处收起列表
  wrap.addEventListener('mousedown', e => {
    const chip = e.target.closest('.mChip');
    const item = e.target.closest('.atItem');
    if (item){
      e.preventDefault(); e.stopPropagation();
      const id = item.closest('.promptBox').dataset.node;
      insertRef(id, Number(item.dataset.idx));
      return;
    }
    if (chip){
      e.preventDefault(); e.stopPropagation();
      const box = chip.closest('.promptBox');
      if (box){
        const ed = box.querySelector('.pEdit');
        if (ed) ed.focus();
        removeChip(box.dataset.node, chip);
      }
      return;
    }
    if (S.atNode && !e.target.closest('.atPop')){ closeAt(); S.at = null; }
  }, true);

  // 输入框失焦时收起列表（focusout 会冒泡，用它省得给每个编辑器单独挂）
  wrap.addEventListener('focusout', e => {
    if (!e.target.classList || !e.target.classList.contains('pEdit')) return;
    setTimeout(() => {
      const a = document.activeElement;
      if (!a || !(a.classList.contains('atPop') || a.closest('.atPop'))) { closeAt(); S.at = null; }
    }, 120);
  });

  wrap.addEventListener('mouseenter', () => {}, true);
}

  $('#zinfo').textContent = Math.round(S.view.k*100) + '%';
